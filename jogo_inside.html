<!-- 1) Descobre a pasta do jogo antes de carregar o Runtime -->
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const nomeJogo =
        params.get('jogo') ||
        params.get('game') ||
        (window.location.hash ? window.location.hash.slice(1) : '') ||
        'flappy';

  const seguro = /^[a-zA-Z0-9_\-]+$/.test(nomeJogo);
  const jogo = seguro ? nomeJogo : 'flappy';

  const baseJogo   = '/amandapps/' + jogo + '/';
  const runtimeSrc = baseJogo + 'src/Runtime.js';
  const cchPath    = baseJogo + 'resources/' + jogo + '.cch';

  window.__JOGO__ = { nome: jogo, base: baseJogo, runtime: runtimeSrc, cch: cchPath };
  console.log('[jogo_inside] carregando jogo:', jogo, '→', baseJogo);

  const s = document.createElement('script');
  s.src = runtimeSrc;
  s.onerror = function () {
    console.error('[jogo_inside] falha ao carregar Runtime.js:', runtimeSrc);
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('erroJogo');
    document.getElementById('erroDetalhe').textContent =
      'Verifique se a pasta /amandapps/' + jogo + '/ existe e contém src/Runtime.js';
    el.style.display = 'block';
  };
  document.head.appendChild(s);
})();
</script>

<!-- 2) Ponte Supabase → página de fim de jogo -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // --------- CONFIG SUPABASE ---------
  const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // --------- CONFIG DE NAVEGAÇÃO ---------
  const FIM_DE_JOGO_URL = '/amandapps/fim-de-jogo.html';

  // --------- NOME DO JOGADOR (localStorage, sem cadastro) ---------
  const NOME_STORAGE_KEY = 'amanfa_player_name';
  const NOME_PADRAO = 'Amanfã';

  function sanitizeName(raw) {
    let s = (raw == null) ? '' : String(raw);
    s = s.replace(/[^A-Za-z0-9 ]/g, '');
    s = s.slice(0, 8).trim();
    return s;
  }
  function getPlayerName() {
    try {
      const stored = sanitizeName(localStorage.getItem(NOME_STORAGE_KEY) || '');
      return stored || NOME_PADRAO;
    } catch (e) {
      return NOME_PADRAO;
    }
  }

  // --------- ESTADO ---------
  let navegando = false;

  // --------- NORMALIZAR FLAG ---------
  function normalizarFlag(v) {
    if (v === true  || v === 'true'  || v === 1 || v === '1') return true;
    if (v === false || v === 'false' || v === 0 || v === '0') return false;
    return false;
  }

  // --------- ENVIAR AO SUPABASE ---------
  async function enviarAoBanco(score, gameId) {
    const payload = {
      player_name: getPlayerName(),
      game_id: gameId,
      score: score,
      user_id: null            // sem cadastro, sempre anônimo
    };
    const { error } = await _supabase.from('scores').insert(payload);
    if (error) {
      console.error('[Supabase] Falha ao salvar pontuação:', error);
      return false;
    }
    console.log('[Supabase] Pontuação salva:', payload.player_name, '—', gameId, '—', score);
    return true;
  }

  // --------- IR PARA FIM DE JOGO ---------
  function irParaFimDeJogo({ score, gameId, salvo, salvouHiscore }) {
    if (navegando) return;
    navegando = true;

    try {
      sessionStorage.setItem('fimDeJogo', JSON.stringify({
        nome: getPlayerName(),        // nome já salvo no dispositivo (ou "Amanfã")
        avatar: '🎮',
        score: score,
        gameId: gameId,
        salvo: !!salvo,
        salvouHiscore: !!salvouHiscore,
        jogoUrl: window.location.pathname + window.location.search
      }));
    } catch (e) {
      console.warn('[fim-de-jogo] sessionStorage falhou:', e);
    }

    window.location.href = FIM_DE_JOGO_URL;
  }

  // --------- PONTE FUSION → PÁGINA ---------
  // Uso no Fusion:
  //   window.receberPontuacaoDoJogo('12', 'flappy', true)   → salva
  //   window.receberPontuacaoDoJogo('12', 'flappy', false)  → NÃO salva
  //   window.receberPontuacaoDoJogo('12', 'flappy')         → NÃO salva (default)
  window.receberPontuacaoDoJogo = async function (score, gameId, flag) {
    const pontuacao = Number(score);
    if (!isFinite(pontuacao)) {
      console.warn('[receberPontuacaoDoJogo] score inválido:', score);
      return;
    }
    const jogo = (gameId && String(gameId)) || (window.__JOGO__ && window.__JOGO__.nome) || 'clickteam';
    const deveSalvar = normalizarFlag(flag);

    let salvo = false;
    if (deveSalvar) {
      try { salvo = await enviarAoBanco(pontuacao, jogo); }
      catch (e) { console.error('[Supabase] Erro ao salvar:', e); salvo = false; }
    }

    irParaFimDeJogo({
      score: pontuacao,
      gameId: jogo,
      salvo: salvo,
      salvouHiscore: deveSalvar && salvo
    });
  };
</script>

<!-- 3) Só inicia o Runtime quando Runtime.js carregar -->
<script>
  function iniciarRuntime() {
    if (typeof Runtime === 'undefined') {
      return setTimeout(iniciarRuntime, 50);
    }
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';

    const wrap = document.getElementById('canvasWrap');
    if (wrap) wrap.style.display = 'flex';

    try {
      new Runtime("MMFCanvas", window.__JOGO__.cch);
      console.log('[jogo_inside] Runtime iniciado com', window.__JOGO__.cch);
    } catch (e) {
      console.error('[jogo_inside] erro ao iniciar Runtime:', e);
      const el = document.getElementById('erroJogo');
      document.getElementById('erroDetalhe').textContent = String(e && e.message ? e.message : e);
      el.style.display = 'block';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciarRuntime);
  } else {
    iniciarRuntime();
  }
</script>
