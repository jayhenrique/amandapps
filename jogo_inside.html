<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, target-densitydpi=device-dpi, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="HandheldFriendly" content="true" />
  <title>Jogo — Amanfã</title>

  <style type="text/css">
    h1 { font-family: Arial, Helvetica, sans-serif; color: #F00; font-size: x-large; }
    p  { font-family: Arial, Helvetica, sans-serif; color: #000; font-size: small; }

    html, body {
      height: 100%; margin: 0; padding: 0;
      background-color: #1A1A2E;
      overflow: hidden;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      text-align: center; overflow: hidden;
      /* usa a viewport real do mobile */
      width: 100vw; height: 100vh;
      height: 100dvh; /* fallback moderno */
    }

    #bloctxt {
      border-left-width: 5px; border-left-style: solid; border-left-color: #F00;
      padding-left: 10px; position: absolute; left: 50%; width: 600px;
      margin-left: -300px; top: 50%; transform: translateY(-50%);
      text-align: left; color: #fff;
    }

    /* Wrapper com tamanho EXATO da tela. O canvas é posicionado
       absolutamente no centro e girado; o wrapper reserva o espaço
       pós-rotação via width/height calculados em JS. */
    #canvasWrap {
      display: none;
      position: relative;
      align-items: center; justify-content: center;
      -webkit-user-select: none; user-select: none;
      overflow: hidden;
      flex: 0 0 auto;
    }

    #MMFCanvas {
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      display: block;
      position: absolute;
      top: 50%; left: 50%;
      transform-origin: center center;
      /* width/height/transform definidos via JS */
      image-rendering: auto;
    }

    #erroJogo {
      display: none; color: #F66; font-family: Arial, sans-serif;
      padding: 20px; font-size: 14px; text-align: center;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 90%; max-width: 500px;
    }

    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #aaa; font-family: Arial, sans-serif; font-size: 14px; text-align: center;
    }
  </style>

  <script>
    if (!document.createElement("canvas").getContext) {
      window.open("http://www.clickteam.com/html5-fallback", "_self");
    }
  </script>
</head>

<body>

<div id="loading">Carregando jogo…</div>

<div id="erroJogo">
  <p style="color:#F66">Não foi possível carregar o jogo.</p>
  <p id="erroDetalhe" style="color:#ccc"></p>
</div>

<div id="canvasWrap">
  <canvas id="MMFCanvas" width="360" height="640">
    Your browser does not support Canvas.
  </canvas>
</div>

<!-- 1) Descobre a pasta do jogo -->
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const nomeJogo =
        params.get('jogo') ||
        params.get('game') ||
        (window.location.hash ? window.location.hash.slice(1) : '') ||
        'flappy';

  const seguro = /^[a-zA-Z0-9_\-]+$/.test(nomeJogo);
  const jogo = seguro ? nomeJogo : 'flappy';

  const orientParam = (params.get('orient') || '').toLowerCase();
  const orientacaoForcada = (orientParam === 'landscape' || orientParam === 'portrait') ? orientParam : null;

  const baseJogo   = '/amandapps/' + jogo + '/';
  const runtimeSrc = baseJogo + 'src/Runtime.js';
  const cchPath    = baseJogo + 'resources/' + jogo + '.cch';

  window.__JOGO__ = {
    nome: jogo,
    base: baseJogo,
    runtime: runtimeSrc,
    cch: cchPath,
    orientacaoForcada: orientacaoForcada
  };
  console.log('[jogo_inside] carregando jogo:', jogo, '→', baseJogo, '| orientação forçada:', orientacaoForcada);

  const s = document.createElement('script');
  s.src = runtimeSrc;
  s.onerror = function () {
    console.error('[jogo_inside] falha ao carregar Runtime.js:', runtimeSrc);
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('erroJogo');
    document.getElementById('erroDetalhe').textContent =
      'Verifique se a pasta /amandapps/' + jogo + '/ existe e contém src/Runtime.js';
    el.style.display = 'block';
  };
  document.head.appendChild(s);
})();
</script>

<script>
  const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const FIM_DE_JOGO_URL = '/amandapps/fim-de-jogo.html';
  const NOME_STORAGE_KEY = 'amanfa_player_name';
  const NOME_PADRAO = 'Amanfã';

  function sanitizeName(raw) {
    let s = (raw == null) ? '' : String(raw);
    s = s.replace(/[^A-Za-z0-9 ]/g, '');
    s = s.slice(0, 8).trim();
    return s;
  }
  function getPlayerName() {
    try {
      const stored = sanitizeName(localStorage.getItem(NOME_STORAGE_KEY) || '');
      return stored || NOME_PADRAO;
    } catch (e) {
      return NOME_PADRAO;
    }
  }

  let navegando = false;

  function normalizarFlag(v) {
    if (v === true  || v === 'true'  || v === 1 || v === '1') return true;
    if (v === false || v === 'false' || v === 0 || v === '0') return false;
    return false;
  }

  async function enviarAoBanco(score, gameId) {
    const payload = {
      player_name: getPlayerName(),
      game_id: gameId,
      score: score,
      user_id: null
    };
    const { error } = await _supabase.from('scores').insert(payload);
    if (error) {
      console.error('[Supabase] Falha ao salvar pontuação:', error);
      return false;
    }
    console.log('[Supabase] Pontuação salva:', payload.player_name, '—', gameId, '—', score);
    return true;
  }

  function irParaFimDeJogo({ score, gameId, salvo, salvouHiscore }) {
    if (navegando) return;
    navegando = true;
    try {
      sessionStorage.setItem('fimDeJogo', JSON.stringify({
        nome: getPlayerName(),
        avatar: '🎮',
        score: score,
        gameId: gameId,
        salvo: !!salvo,
        salvouHiscore: !!salvouHiscore,
        jogoUrl: window.location.pathname + window.location.search
      }));
    } catch (e) {
      console.warn('[fim-de-jogo] sessionStorage falhou:', e);
    }
    window.location.href = FIM_DE_JOGO_URL;
  }

  window.receberPontuacaoDoJogo = async function (score, gameId, flag) {
    const pontuacao = Number(score);
    if (!isFinite(pontuacao)) {
      console.warn('[receberPontuacaoDoJogo] score inválido:', score);
      return;
    }
    const jogo = (gameId && String(gameId)) || (window.__JOGO__ && window.__JOGO__.nome) || 'clickteam';
    const deveSalvar = normalizarFlag(flag);

    let salvo = false;
    if (deveSalvar) {
      try { salvo = await enviarAoBanco(pontuacao, jogo); }
      catch (e) { console.error('[Supabase] Erro ao salvar:', e); salvo = false; }
    }

    irParaFimDeJogo({
      score: pontuacao,
      gameId: jogo,
      salvo: salvo,
      salvouHiscore: deveSalvar && salvo
    });
  };
</script>

<!-- 3) Runtime + orientação -->
<script>
  // -------- Detecção de dispositivo móvel --------
  function ehMobile() {
    // considera mobile se tiver touch E viewport pequena, ou user agent móvel
    const ua = navigator.userAgent || '';
    const uaMobile = /Android|iPhone|iPad|iPod|Mobile|Opera Mini|IEMobile/i.test(ua);
    const touch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    const telaPequena = Math.min(window.innerWidth, window.innerHeight) <= 900;
    return uaMobile || (touch && telaPequena);
  }

  // -------- Viewport real (lida com barra de endereço do mobile) --------
  function getViewport() {
    const vv = window.visualViewport;
    if (vv && vv.width && vv.height) {
      return { w: vv.width, h: vv.height };
    }
    return { w: window.innerWidth, h: window.innerHeight };
  }

  // -------- Aplica orientação/scale --------
  function aplicarOrientacao() {
    const canvas = document.getElementById('MMFCanvas');
    const wrap   = document.getElementById('canvasWrap');
    if (!canvas || !wrap) return;

    const vp = getViewport();
    const vw = Math.floor(vp.w);
    const vh = Math.floor(vp.h);

    // Dimensões lógicas do jogo
    const lw = canvas.width  || 360;
    const lh = canvas.height || 640;

    const forcada = window.__JOGO__ && window.__JOGO__.orientacaoForcada;
    let jogoLandscape;
    if (forcada === 'landscape') jogoLandscape = true;
    else if (forcada === 'portrait') jogoLandscape = false;
    else jogoLandscape = lw > lh;

    // Determina se precisamos girar:
    // - jogo landscape + mobile em retrato  → girar
    // - jogo portrait  + mobile em paisagem → girar (para aproveitar melhor)
    // - desktop → NUNCA girar (mostra como está)
    const mobile = ehMobile();
    const telaPaisagem = vw > vh;

    let girar = false;
    if (mobile) {
      if (jogoLandscape && !telaPaisagem) girar = true;   // jogo landscape, tela em pé
      if (!jogoLandscape && telaPaisagem) girar = true;   // jogo retrato, tela deitada
    }
    // Desktop: girar = false sempre.

    // Limpa estilos
    canvas.style.transform = '';
    canvas.style.width = '';
    canvas.style.height = '';
    canvas.style.maxWidth = '';
    canvas.style.maxHeight = '';
    wrap.style.width = '';
    wrap.style.height = '';

    // Sempre centraliza no centro do wrap
    canvas.style.top = '50%';
    canvas.style.left = '50%';

    if (!girar) {
      // --- SEM ROTAÇÃO ---
      // Encaixa o canvas na tela mantendo proporção
      const escala = Math.min(vw / lw, vh / lh);
      const cw = Math.floor(lw * escala);
      const ch = Math.floor(lh * escala);

      wrap.style.width  = vw + 'px';
      wrap.style.height = vh + 'px';

      canvas.style.width  = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.style.maxWidth = 'none';
      canvas.style.maxHeight = 'none';
      canvas.style.transform = 'translate(-50%, -50%)';
      console.log('[orientacao] sem rotação | jogo', lw + 'x' + lh, '| tela', vw + 'x' + vh, '| escala', escala.toFixed(3));
    } else {
      // --- COM ROTAÇÃO 90° ---
      // Após girar, a largura visual = lh e a altura visual = lw.
      // Precisamos encaixar (lh x lw) em (vw x vh).
      const escala = Math.min(vw / lh, vh / lw);
      const cw = Math.floor(lw * escala); // dimensão antes de girar
      const ch = Math.floor(lh * escala);
      const wPos = Math.floor(lh * escala); // largura ocupada na tela após girar
      const hPos = Math.floor(lw * escala); // altura ocupada na tela após girar

      // O wrap reserva o espaço PÓS-rotação, centralizado na tela.
      // Assim nada é cortado: o canvas girado cabe exatamente no wrap,
      // e o wrap cabe na tela.
      wrap.style.width  = wPos + 'px';
      wrap.style.height = hPos + 'px';

      canvas.style.width  = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.style.maxWidth = 'none';
      canvas.style.maxHeight = 'none';
      canvas.style.transform = 'translate(-50%, -50%) rotate(90deg)';
      console.log('[orientacao] ROTACIONADO 90° | jogo', lw + 'x' + lh, '| tela', vw + 'x' + vh, '| escala', escala.toFixed(3), '| espaço', wPos + 'x' + hPos);
    }
  }

  // Reaplica ao redimensionar / mudar orientação
  window.addEventListener('resize', aplicarOrientacao);
  window.addEventListener('orientationchange', function () {
    setTimeout(aplicarOrientacao, 200);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', aplicarOrientacao);
  }

  // Observa mudanças de tamanho do canvas (Fusion pode redimensionar)
  function observarCanvas() {
    const canvas = document.getElementById('MMFCanvas');
    if (!canvas || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(function () {
      aplicarOrientacao();
    });
    ro.observe(canvas);
  }

  function iniciarRuntime() {
    if (typeof Runtime === 'undefined') {
      return setTimeout(iniciarRuntime, 50);
    }
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';

    const wrap = document.getElementById('canvasWrap');
    if (wrap) wrap.style.display = 'flex';

    try {
      new Runtime("MMFCanvas", window.__JOGO__.cch);
      console.log('[jogo_inside] Runtime iniciado com', window.__JOGO__.cch);

      // Dá um tempo para o Fusion definir width/height do canvas
      setTimeout(function () {
        aplicarOrientacao();
        observarCanvas();
      }, 150);
    } catch (e) {
      console.error('[jogo_inside] erro ao iniciar Runtime:', e);
      const el = document.getElementById('erroJogo');
      document.getElementById('erroDetalhe').textContent = String(e && e.message ? e.message : e);
      el.style.display = 'block';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciarRuntime);
  } else {
    iniciarRuntime();
  }
</script>

</body>
</html>
