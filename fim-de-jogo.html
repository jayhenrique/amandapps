<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Fim de jogo — Arcade Central</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #1A1A2E;
            color: #eaeaea;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
        }

        .wrap {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            gap: 1rem;
        }

        .panel {
            background: #16213e;
            border: 1px solid #2a3a5c;
            border-radius: 14px;
            width: 100%;
            max-width: 380px;
            padding: 1.6rem 1.4rem;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6);
            animation: panelIn 0.25s ease-out;
        }
        @keyframes panelIn {
            from { transform: translateY(15px); opacity: 0; }
            to   { transform: translateY(0);   opacity: 1; }
        }

        .thumb {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 300 / 250;
            margin: 0 auto 1.1rem;
            border-radius: 10px;
            overflow: hidden;
            background: #0f3460;
            border: 1px solid #2a3a5c;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .thumb .thumb-fallback {
            font-size: 4rem;
            color: #8a8fa3;
            display: none;
        }
        .thumb.error img { display: none; }
        .thumb.error .thumb-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .profile-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin: 0 auto 1.1rem;
            max-width: 300px;
        }

        .profile-row .avatar {
            width: 56px;
            height: 56px;
            min-width: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #0f3460, #1f2b4d);
            border: 2px solid #e94560;
            box-shadow: 0 0 0 4px rgba(233, 69, 96, 0.12);
        }
        .panel.anon .profile-row .avatar {
            border-color: #2a3a5c;
            box-shadow: 0 0 0 4px rgba(138, 143, 163, 0.06);
        }

        .profile-row .name {
            font-size: 1.15rem;
            font-weight: 700;
            color: #eaeaea;
            text-align: left;
            line-height: 1.2;
            word-break: break-word;
        }

        .score-box {
            background: #0f3460;
            border: 1px solid #2a3a5c;
            border-radius: 10px;
            padding: 1.1rem 1rem;
            margin-bottom: 1rem;
        }
        .score-label {
            font-size: 0.75rem;
            color: #8a8fa3;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }
        .score-value {
            font-size: 3.2rem;
            font-weight: 800;
            color: #f5c518;
            line-height: 1;
        }
        .score-value.error {
            color: #ff7b8a;
        }

        .status {
            font-size: 0.78rem;
            min-height: 1.1em;
            margin-bottom: 1rem;
        }
        .status.ok { color: #6ee7a8; }
        .status.error { color: #ff7b8a; }
        .status.warn { color: #f5c518; }

        .actions {
            display: flex;
            gap: 0.6rem;
        }
        .actions button {
            flex: 1;
            padding: 0.8rem 0.5rem;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        .actions button:hover { opacity: 0.92; }
        .actions button:active { transform: scale(0.98); }

        .btn-retry { background: #e94560; color: #fff; }
        .btn-home  {
            background: transparent;
            color: #8a8fa3;
            border: 1px solid #2a3a5c !important;
        }
        .btn-home:hover { color: #eaeaea; border-color: #8a8fa3 !important; }

        /* DEBUG — game ID, fora do layout principal */
        .debug-game-id {
            font-size: 0.7rem;
            color: #4a5578;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: 0.3px;
            user-select: all;
        }
    </style>
</head>
<body>

<div class="wrap">
    <div class="panel" id="panel">
        <div class="thumb" id="thumb-wrap">
            <img id="thumb-img" src="" alt="Thumb do jogo">
            <div class="thumb-fallback">🎮</div>
        </div>

        <div class="profile-row" id="profile-row">
            <div class="avatar" id="avatar">🎮</div>
            <div class="name" id="name">—</div>
        </div>

        <div class="score-box" id="score-box">
            <div class="score-label">Pontuação</div>
            <div class="score-value" id="score-value">0</div>
        </div>

        <div class="status" id="status"></div>

        <div class="actions" id="actions">
            <button type="button" class="btn-retry" id="btn-retry">🔄 Tentar de novo</button>
            <button type="button" class="btn-home" id="btn-home">🏠 Voltar para home</button>
        </div>
    </div>

    <!-- DEBUG: id do jogo (fora do card, discreto) -->
    <div class="debug-game-id" id="debug-game-id">game_id: —</div>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // =====================================================
    // CONFIG
    // =====================================================
    const HOME_URL    = '/amandapps/';
    const THUMB_DIR   = '/amandapps/thumbs-assets';
    const JOGO_PADRAO_URL = '/amandapps/teste/index.html';

    const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // =====================================================
    // ELEMENTOS
    // =====================================================
    const elAvatar  = document.getElementById('avatar');
    const elName    = document.getElementById('name');
    const elScore   = document.getElementById('score-value');
    const elStatus  = document.getElementById('status');
    const panel     = document.getElementById('panel');
    const elDebugId = document.getElementById('debug-game-id');
    const thumbWrap = document.getElementById('thumb-wrap');
    const thumbImg  = document.getElementById('thumb-img');

    let jogoUrl = JOGO_PADRAO_URL;

    // =====================================================
    // HELPERS
    // =====================================================
    async function getQuintoLugar(gameId) {
        // range(4,4) pega só a posição 5 (índice 4).
        // Retorna valor=null se não houver 5 scores.
        const { data, error } = await _supabase
            .from('scores')
            .select('score')
            .eq('game_id', gameId)
            .order('score', { ascending: false })
            .range(4, 4);

        if (error) return { valor: null, erro: error };
        if (!data || data.length === 0) return { valor: null, erro: null };
        return { valor: Number(data[0].score), erro: null };
    }

    async function salvarSeBaterRecorde(dados) {
        // 1) busca o 5º colocado
        const { valor: quinto, erro } = await getQuintoLugar(dados.gameId);
        if (erro) {
            console.warn('[fim-de-jogo] erro ao checar 5º lugar:', erro);
            return { salvo: false, motivo: 'erro_consulta' };
        }

        // 2) só salva se entrou no top 5 (ou se o top 5 ainda não está cheio)
        const podeSalvar = (quinto === null) || (dados.score >= quinto);
        if (!podeSalvar) {
            return { salvo: false, motivo: 'fora_do_top5', quinto };
        }

        // 3) insert
        const nome = (dados.nome || '').trim().slice(0, 20) || 'Anônimo';
        const { error: errInsert } = await _supabase
            .from('scores')
            .insert({ game_id: dados.gameId, player_name: nome, score: dados.score });

        if (errInsert) {
            console.warn('[fim-de-jogo] erro ao salvar:', errInsert);
            return { salvo: false, motivo: 'erro_insert', quinto };
        }

        return { salvo: true, quinto };
    }

    // =====================================================
    // INIT
    // =====================================================
    async function iniciar() {
        let dados = null;
        try {
            const raw = sessionStorage.getItem('fimDeJogo');
            if (raw) dados = JSON.parse(raw);
        } catch (e) {
            console.warn('[fim-de-jogo] sessionStorage inválido:', e);
        }

        // ---------------- Sem dados: estado de erro ----------------
        if (!dados || typeof dados.score !== 'number') {
            panel.classList.add('anon');
            elAvatar.textContent = '⚠';
            elName.textContent   = 'Erro';
            elScore.textContent  = 'Erro';
            elScore.classList.add('error');
            elStatus.textContent = '⚠ Nenhum resultado encontrado.';
            elStatus.className   = 'status error';

            thumbWrap.classList.add('error');
            thumbImg.removeAttribute('src');
            thumbImg.alt = 'Thumb indisponível';

            elDebugId.textContent = 'game_id: —';
            jogoUrl = JOGO_PADRAO_URL;
            return;
        }

        // ---------------- Caminho normal ----------------
        elAvatar.textContent = dados.avatar || '🎮';
        elName.textContent   = dados.nome || 'Anônimo';
        panel.classList.toggle('anon', !dados.nome || dados.nome === 'Anônimo');

        elScore.textContent = Number(dados.score).toLocaleString('pt-BR');
        elScore.classList.remove('error');

        const gameId = dados.gameId || 'clickteam';
        const thumbUrl = `${THUMB_DIR}/${encodeURIComponent(gameId)}.png`;
        thumbImg.src = thumbUrl;
        thumbImg.alt = `Thumb do jogo ${gameId}`;
        thumbImg.onerror = () => {
            thumbWrap.classList.add('error');
            thumbImg.removeAttribute('src');
            console.warn('[fim-de-jogo] thumb não encontrada:', thumbUrl);
        };

        elDebugId.textContent = `game_id: ${gameId}`;
        jogoUrl = dados.jogoUrl || JOGO_PADRAO_URL;

        // ---------------- Checagem + save condicional ----------------
        elStatus.textContent = 'Verificando ranking...';
        elStatus.className   = 'status';

        const resultado = await salvarSeBaterRecorde({ ...dados, gameId });

        if (resultado.salvo) {
            elStatus.textContent = '✔ Pontuação salva no Top 5!';
            elStatus.className   = 'status ok';
        } else if (resultado.motivo === 'fora_do_top5') {
            const q = resultado.quinto;
            elStatus.textContent = `Você não entrou no Top 5 (5º lugar: ${q.toLocaleString('pt-BR')} pts).`;
            elStatus.className   = 'status warn';
        } else {
            elStatus.textContent = '⚠ Não foi possível salvar a pontuação.';
            elStatus.className   = 'status error';
        }
    }

    // =====================================================
    // BOTÕES
    // =====================================================
    document.getElementById('btn-retry').addEventListener('click', () => {
        try { sessionStorage.removeItem('fimDeJogo'); } catch (e) {}
        window.location.href = jogoUrl;
    });

    document.getElementById('btn-home').addEventListener('click', () => {
        try { sessionStorage.removeItem('fimDeJogo'); } catch (e) {}
        window.location.href = HOME_URL;
    });

    // =====================================================
    // START
    // =====================================================
    document.addEventListener('DOMContentLoaded', iniciar);
</script>

</body>
</html>
