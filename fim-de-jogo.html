<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fim de jogo — Amanfã</title>
  <style>
    body {
      background-color: #1A1A2E;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      margin: 0;
      padding: 40px 20px;
    }
    .card {
      max-width: 420px;
      margin: 0 auto;
      background: #16213E;
      border-radius: 16px;
      padding: 32px 24px;
      border-left: 5px solid #F00;
      text-align: center;
    }
    .avatar { font-size: 56px; margin-bottom: 8px; }
    .nome { font-size: 20px; font-weight: bold; margin-bottom: 4px; }
    .score { font-size: 48px; font-weight: bold; color: #F00; margin: 16px 0; }
    .label { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: #aaa; }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      margin-top: 8px;
    }
    .badge-salvo   { background: #1f6f3f; color: #b6f5c8; }
    .badge-offline { background: #4a3b1a; color: #f5e0a0; }
    a.btn {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 28px;
      background: #F00;
      color: #fff;
      text-decoration: none;
      border-radius: 999px;
      font-weight: bold;
      font-size: 16px;
    }
    a.btn:hover { background: #c00; }
    a.link {
      display: block;
      margin-top: 16px;
      color: #8ab4f8;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar" id="avatar">🎭</div>
    <div class="nome" id="nome">Um Amanfã</div>
    <div class="label">Pontuação</div>
    <div class="score" id="score">0</div>
    <div id="badge"></div>
    <a class="btn" id="btnJogarNovamente" href="/jogo_inside.html">Jogar novamente</a>
    <a class="link" href="/">Voltar para a home</a>
  </div>

  <script>
    (function () {
      let dados = null;
      try {
        dados = JSON.parse(sessionStorage.getItem('fimDeJogo') || 'null');
      } catch (e) {
        console.warn('sessionStorage inválido:', e);
      }

      if (!dados) {
        document.getElementById('nome').textContent = 'Nenhum jogo recente';
        document.getElementById('btnJogarNovamente').href = '/';
        return;
      }

      document.getElementById('avatar').textContent = dados.avatar || '🎭';
      document.getElementById('nome').textContent   = dados.nome   || 'Um Amanfã';
      document.getElementById('score').textContent  = dados.score  != null ? dados.score : 0;

      // Botão "Jogar novamente" volta para o MESMO jogo
      const btn = document.getElementById('btnJogarNovamente');
      if (dados.jogoUrl) {
        btn.href = dados.jogoUrl; // ex: /jogo_inside.html?jogo=flappy
      } else if (dados.gameId) {
        btn.href = '/jogo_inside.html?jogo=' + encodeURIComponent(dados.gameId);
      }

      // Badge de status
      const badge = document.getElementById('badge');
      if (dados.salvouHiscore) {
        badge.className = 'badge badge-salvo';
        badge.textContent = '✔ Pontuação salva no ranking';
      } else if (dados.salvo === false) {
        badge.className = 'badge badge-offline';
        badge.textContent = 'Pontuação não enviada ao ranking';
      }
    })();
  </script>
</body>
</html>
