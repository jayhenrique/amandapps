<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1a2e">
  <title>Amand.Apps Games</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Amand.Apps Games</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="placar.html">Placar</a>
      <a href="login.html" id="nav-auth">Entrar</a>
    </nav>
  </header>

  <main>
    <section id="games-list">
      <div class="game-card" data-game="Flappy Amand">
        <img src="image_game.png" alt="Flappy Amand" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22120%22 height=%22120%22><rect fill=%22%23162d3e%22 width=%22120%22 height=%22120%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23fff%22 font-size=%2214%22 text-anchor=%22middle%22 dy=%22.3em%22>Flappy</text></svg>'">
        <h3>Flappy Amand</h3>
        <div class="top-score" data-game="Flappy Amand">Carregando...</div>
      </div>
      <!-- Adicione mais jogos aqui no futuro -->
    </section>

    <section id="activity-feed">
      <h2>Registro de Atividades</h2>
      <ul id="activity-list"></ul>
    </section>
  </main>

  <a href="https://www.instagram.com/amand.apps" target="_blank" class="instagram-btn">📷 @amand.apps</a>

  <script>
    const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadTopScores() {
      const cards = document.querySelectorAll('.top-score');
      for (const card of cards) {
        const game = card.dataset.game;
        const { data } = await supabase
          .from('scores')
          .select('username, score')
          .eq('game_name', game)
          .order('score', { ascending: false })
          .limit(1);
        if (data && data.length > 0) {
          card.textContent = `${data[0].username || 'Anônimo'}: ${data[0].score}`;
          card.onclick = () => location.href = `placar.html?game=${encodeURIComponent(game)}`;
        } else {
          card.textContent = 'Sem recordes ainda';
        }
      }
    }

    async function loadActivities() {
      const { data } = await supabase
        .from('activities')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(10);
      const list = document.getElementById('activity-list');
      list.innerHTML = (data || []).map(a => {
        const name = a.username || 'Um Amandfã';
        return `<li>${name} fez ${a.score} pontos em ${a.game_name}</li>`;
      }).join('');
    }

    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      const navAuth = document.getElementById('nav-auth');
      if (session) {
        const { data: profile } = await supabase.from('profiles').select('username').eq('id', session.user.id).single();
        navAuth.textContent = profile?.username || 'Área Logada';
        navAuth.href = 'area-logada.html';
      }
    }

    checkAuth();
    loadTopScores();
    loadActivities();

    // Redirecionar clique no card para o jogo
    document.querySelectorAll('.game-card').forEach(card => {
      card.addEventListener('click', (e) => {
        if (e.target.classList.contains('top-score')) return;
        location.href = 'flappy.html';
      });
    });

    // Registrar Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
