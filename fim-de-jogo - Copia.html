<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Fim de jogo — Arcade Central</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #1A1A2E;              /* laterais pretas quando a tela é mais larga que a imagem */
            color: #eaeaea;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            overflow: hidden;
        }

        /* ===== PALCO: fundo preto cobre a página inteira ===== */
        .stage {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* container centralizado: limita a imagem à altura, sem esticar pros lados */
        .bg-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 0;
            background: #000;              /* preto nas laterais */
        }

        /* fallback verde (teste) — fica atrás da imagem */
        .bg-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: #00b140;
            z-index: -1;
        }
        .bg-wrap.has-img::before { display: none; }  /* se tem imagem, some o verde */

        /* imagem: ajustada pela altura, centralizada, sem expandir pros lados */
        .bg-img {
            height: 100%;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
        }
        .bg-img.hidden { display: none; }

        /* escurecimento para o texto ficar legível por cima da imagem */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.10) 0%,
                rgba(0, 0, 0, 0.30) 55%,
                rgba(0, 0, 0, 0.90) 100%
            );
            z-index: 1;
            pointer-events: none;
        }

        /* ===== CONTEÚDO SOBREPOSTO ===== */
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;   /* tudo empurrado para baixo */
            align-items: center;
            gap: 0.55rem;
            padding: 1.5rem 1.2rem 1.4rem;
        }

        /* usuário */
        .profile-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            max-width: 360px;
            width: 100%;
        }

        .profile-row .avatar {
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            background: linear-gradient(135deg, #0f3460, #1f2b4d);
            border: 2px solid #e94560;
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.12);
        }
        .anon .profile-row .avatar {
            border-color: #2a3a5c;
            box-shadow: 0 0 0 3px rgba(138, 143, 163, 0.06);
        }

        .profile-row .name {
            font-size: 1.35rem;
            font-weight: 700;
            color: #eaeaea;
            text-align: left;
            line-height: 1.15;
            word-break: break-word;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
        }

        /* pontuação */
        .score-box {
            text-align: center;
        }
        .score-label {
            font-size: 0.7rem;
            color: #c7cbe0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.1rem;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
        }
        .score-value {
            font-size: 2.6rem;
            font-weight: 800;
            color: #f5c518;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }
        .score-value.error {
            color: #ff7b8a;
            font-size: 2rem;
        }

        /* status */
        .status {
            font-size: 0.85rem;
            font-weight: 600;
            min-height: 1.2em;
            text-align: center;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
        }
        .status.ok    { color: #6ee7a8; }
        .status.error { color: #ff7b8a; }
        .status.info  { color: #8a8fa3; }

        /* ações */
        .actions {
            display: flex;
            gap: 0.6rem;
            width: 100%;
            max-width: 360px;
            margin-top: 0.2rem;
        }
        .actions button {
            flex: 1;
            padding: 0.75rem 0.5rem;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }
        .actions button:hover { opacity: 0.92; }
        .actions button:active { transform: scale(0.98); }

        .btn-retry { background: #e94560; color: #fff; }
        .btn-home  {
            background: rgba(22, 33, 62, 0.85);
            color: #eaeaea;
            border: 1px solid #2a3a5c !important;
            backdrop-filter: blur(4px);
        }
        .btn-home:hover { border-color: #8a8fa3 !important; }

        /* DEBUG discreto */
        .debug-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            margin-top: 0.25rem;
        }
        .debug-game-id {
            font-size: 0.62rem;
            color: #c7cbe0;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: 0.3px;
            user-select: all;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }
        .debug-game-id .val-true  { color: #6ee7a8; }
        .debug-game-id .val-false { color: #ff7b8a; }
    </style>
</head>
<body>

<div class="stage" id="stage">
    <!-- container da imagem: centralizado, fundo preto nas laterais -->
    <div class="bg-wrap" id="bg-wrap">
        <img id="bg-img" class="bg-img" src="" alt="Imagem do jogo">
    </div>

    <div class="overlay"></div>

    <!-- conteúdo sobreposto -->
    <div class="content" id="content">
        <div class="profile-row" id="profile-row">
            <div class="avatar" id="avatar">🎮</div>
            <div class="name" id="name">—</div>
        </div>

        <div class="score-box" id="score-box">
            <div class="score-label">Pontuação</div>
            <div class="score-value" id="score-value">0</div>
        </div>

        <div class="status" id="status"></div>

        <div class="actions" id="actions">
            <button type="button" class="btn-retry" id="btn-retry">🔄 Tentar de novo</button>
            <button type="button" class="btn-home" id="btn-home">🏠 Voltar para home</button>
        </div>

        <!-- DEBUG: game_id, score e flag -->
        <div class="debug-block">
            <div class="debug-game-id" id="debug-game-id">game_id: —</div>
            <div class="debug-game-id" id="debug-score">score: —</div>
            <div class="debug-game-id" id="debug-flag">flag: —</div>
        </div>
    </div>
</div>

<script>
    // =====================================================
    // CONFIG
    // =====================================================
    const HOME_URL    = '/amandapps/';                // home na raiz do repo
    const THUMB_DIR   = '/amandapps/thumbs-assets';   // pasta de thumbs na raiz

    // Fallback caso o sessionStorage esteja vazio
    const JOGO_PADRAO_URL = '/amandapps/teste/index.html';

    // Nome padrão exibido quando o jogador é anônimo
    const NOME_ANONIMO = 'Um Amanfã';

    // =====================================================
    // LER DADOS
    // =====================================================
    let dados = null;
    try {
        const raw = sessionStorage.getItem('fimDeJogo');
        if (raw) dados = JSON.parse(raw);
    } catch (e) {
        console.warn('[fim-de-jogo] sessionStorage inválido:', e);
    }

    const elAvatar       = document.getElementById('avatar');
    const elName         = document.getElementById('name');
    const elScore        = document.getElementById('score-value');
    const elStatus       = document.getElementById('status');
    const content        = document.getElementById('content');
    const stage          = document.getElementById('stage');

    const elDebugId      = document.getElementById('debug-game-id');
    const elDebugScore   = document.getElementById('debug-score');
    const elDebugFlag    = document.getElementById('debug-flag');

    const bgWrap         = document.getElementById('bg-wrap');
    const bgImg          = document.getElementById('bg-img');

    let jogoUrl = JOGO_PADRAO_URL;

    // normaliza a flag: aceita true, "true", 1, "1", false, "false", 0, "0"
    function normalizarFlag(v) {
        if (v === true  || v === 'true'  || v === 1 || v === '1') return true;
        if (v === false || v === 'false' || v === 0 || v === '0') return false;
        return null; // ausente / desconhecido
    }

    // renderiza a flag no debug com cor (verde/vermelho) e valor bruto
    function renderDebugFlag(valorBruto) {
        if (valorBruto === undefined) {
            elDebugFlag.innerHTML = 'flag: —';
            return;
        }
        const normalizado = normalizarFlag(valorBruto);
        const texto = normalizado === true  ? 'true'
                    : normalizado === false ? 'false'
                    : JSON.stringify(valorBruto);
        const corClasse = normalizado === true  ? 'val-true'
                        : normalizado === false ? 'val-false'
                        : '';
        elDebugFlag.innerHTML = `flag: <span class="${corClasse}">${texto}</span>`;
    }

    // Resolve o nome a exibir: se vier vazio OU "Anônimo"/"Anonimo",
    // usa o nome padrão "Um Amanfã".
    function resolverNome(nomeRecebido) {
        const nome = (nomeRecebido == null) ? '' : String(nomeRecebido).trim();
        if (!nome || nome.toLowerCase() === 'anônimo' || nome.toLowerCase() === 'anonimo') {
            return NOME_ANONIMO;
        }
        return nome;
    }

    if (dados && typeof dados.score === 'number') {
        // -------- Caminho normal: dados válidos --------
        const nomeExibicao = resolverNome(dados.nome);

        elAvatar.textContent = dados.avatar || '🎮';
        elName.textContent   = nomeExibicao;
        content.classList.toggle('anon', nomeExibicao === NOME_ANONIMO);

        elScore.textContent = Number(dados.score).toLocaleString('pt-BR');
        elScore.classList.remove('error');

        // -------- Flag de hiscore --------
        const flagBruta = 'salvouHiscore' in dados ? dados.salvouHiscore : dados.salvo;
        const flag = normalizarFlag(flagBruta);

        if (flag === true) {
            elStatus.textContent = '🏆 Entrou no hiscore!';
            elStatus.className = 'status ok';
        } else if (flag === false) {
            elStatus.textContent = '🔄 Tente novamente';
            elStatus.className = 'status error';
        } else {
            if (dados.salvo) {
                elStatus.textContent = '✔ Pontuação salva!';
                elStatus.className = 'status ok';
            } else {
                elStatus.textContent = '⚠ Não foi possível salvar a pontuação.';
                elStatus.className = 'status error';
            }
        }

        const gameId = dados.gameId || 'clickteam';
        const thumbUrl = `${THUMB_DIR}/${encodeURIComponent(gameId)}end.png`;
        bgImg.src = thumbUrl;
        bgImg.alt = `Imagem do jogo ${gameId}`;
        bgImg.onerror = () => {
            // sem imagem → esconde a img e deixa o verde de teste aparecer
            bgImg.classList.add('hidden');
            bgWrap.classList.remove('has-img');
            console.warn('[fim-de-jogo] thumb não encontrada:', thumbUrl);
        };
        bgImg.onload = () => {
            bgWrap.classList.add('has-img');   // tem imagem → some o verde
        };

        // -------- DEBUG --------
        elDebugId.textContent    = `game_id: ${gameId}`;
        elDebugScore.textContent = `score: ${Number(dados.score).toLocaleString('pt-BR')}`;
        renderDebugFlag(flagBruta);

        jogoUrl = dados.jogoUrl || JOGO_PADRAO_URL;
    } else {
        // -------- Sem dados: layout em estado de erro (fallback verde) --------
        content.classList.add('anon');
        bgImg.classList.add('hidden');        // fica só o verde de teste
        bgWrap.classList.remove('has-img');

        elAvatar.textContent = '⚠';
        elName.textContent   = 'Erro';

        elScore.textContent = 'Erro';
        elScore.classList.add('error');

        elStatus.textContent = '⚠ Nenhum resultado encontrado.';
        elStatus.className = 'status error';

        // -------- DEBUG (estado sem dados) --------
        elDebugId.textContent    = 'game_id: —';
        elDebugScore.textContent = 'score: —';
        elDebugFlag.innerHTML    = 'flag: —';

        jogoUrl = JOGO_PADRAO_URL;
    }

    // =====================================================
    // BOTÕES
    // =====================================================
    document.getElementById('btn-retry').addEventListener('click', () => {
        try { sessionStorage.removeItem('fimDeJogo'); } catch (e) {}

        if (window.history.length > 1) {
            window.history.go(-2);
        } else {
            window.location.href = jogoUrl;
        }
    });

    document.getElementById('btn-home').addEventListener('click', () => {
        try { sessionStorage.removeItem('fimDeJogo'); } catch (e) {}
        window.location.href = HOME_URL;
    });
</script>

</body>
</html>
