<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Área — Amand.Apps Games</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Minha Área</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="placar.html">Placar</a>
      <a href="#" id="logout-btn">Sair</a>
    </nav>
  </header>
  <main>
    <div id="user-info"></div>
    
    <h3>Escolha seu Avatar</h3>
    <div id="avatar-grid"></div>

    <h3>Minhas Atividades</h3>
    <ul id="my-activities"></ul>
  </main>

  <script>
    const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { location.href = 'login.html'; return; }
      currentUser = session.user;

      const { data: profile } = await supabase.from('profiles').select('*').eq('id', currentUser.id).single();
      document.getElementById('user-info').innerHTML = `
        <p>Logado como: <strong>${profile?.username || currentUser.email}</strong></p>
      `;

      // Avatares
      const grid = document.getElementById('avatar-grid');
      grid.innerHTML = Array.from({ length: 6 }, (_, i) => `
        <img src="${SUPABASE_URL}/storage/v1/object/public/avatars/avatar${i+1}.png" 
             data-index="${i}" class="avatar ${profile?.avatar_index === i ? 'selected' : ''}"
             onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22><rect fill=%22%23333%22 width=%2264%22 height=%2264%22/><text x=%2250%25%22 y=%2250%25%22 fill=%22%23fff%22 font-size=%2212%22 text-anchor=%22middle%22 dy=%22.3em%22>${i+1}</text></svg>'">
      `).join('');
      
      grid.querySelectorAll('.avatar').forEach(img => {
        img.onclick = async () => {
          const idx = parseInt(img.dataset.index);
          await supabase.from('profiles').update({ avatar_index: idx }).eq('id', currentUser.id);
          grid.querySelectorAll('.avatar').forEach(a => a.classList.remove('selected'));
          img.classList.add('selected');
        };
      });

      // Atividades do usuário
      const { data: acts } = await supabase
        .from('activities')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false })
        .limit(20);
      
      document.getElementById('my-activities').innerHTML = (acts || []).map(a => 
        `<li>${a.game_name}: ${a.score} pontos — ${new Date(a.created_at).toLocaleDateString()}</li>`
      ).join('') || '<li>Nenhuma atividade ainda.</li>';
    }

    document.getElementById('logout-btn').onclick = async (e) => {
      e.preventDefault();
      await supabase.auth.signOut();
      location.href = 'index.html';
    };

    init();
  </script>
</body>
</html>
