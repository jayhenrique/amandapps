<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>

  <title>Jogo — Amanfã</title>

  <style type="text/css">
    h1 { font-family: Arial, Helvetica, sans-serif; color: #F00; font-size: x-large; }
    p  { font-family: Arial, Helvetica, sans-serif; color: #000; font-size: small; }

    html, body {
      height: 100%; margin: 0; padding: 0;
      background-color: #1A1A2E;
    }
    body {
      display: flex; align-items: center; justify-content: center;
      text-align: center; overflow: hidden;
    }

    #bloctxt {
      border-left-width: 5px; border-left-style: solid; border-left-color: #F00;
      padding-left: 10px; position: absolute; left: 50%; width: 600px;
      margin-left: -300px; top: 50%; transform: translateY(-50%);
      text-align: left; color: #fff;
    }

    /* Wrapper que centraliza o canvas e permite rotação */
    #canvasWrap {
      display: none;
      align-items: center; justify-content: center;
      max-width: 100vw; max-height: 100vh;
      -webkit-user-select: none; user-select: none;
      overflow: hidden;
    }

    #MMFCanvas {
      touch-action: none; user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent; display: block;
      max-width: 100vw; max-height: 100vh;
      width: auto; height: auto; object-fit: contain;
      transform-origin: center center;
    }

    #erroJogo {
      display: none; color: #F66; font-family: Arial, sans-serif;
      padding: 20px; font-size: 14px; text-align: center;
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); width: 90%; max-width: 500px;
    }

    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #aaa; font-family: Arial, sans-serif; font-size: 14px; text-align: center;
    }
  </style>

  <script>
    if (!document.createElement("canvas").getContext) {
      window.open("http://www.clickteam.com/html5-fallback", "_self");
    }
  </script>
</head>

<body>

<div id="loading">Carregando jogo…</div>

<div id="erroJogo">
  <p style="color:#F66">Não foi possível carregar o jogo.</p>
  <p id="erroDetalhe" style="color:#ccc"></p>
</div>

<div id="canvasWrap">
  <canvas id="MMFCanvas" width="360" height="640">
    Your browser does not support Canvas.
  </canvas>
</div>

<!-- 1) Descobre a pasta do jogo antes de carregar o Runtime -->
<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  const nomeJogo =
        params.get('jogo') ||
        params.get('game') ||
        (window.location.hash ? window.location.hash.slice(1) : '') ||
        'flappy';

  const seguro = /^[a-zA-Z0-9_\-]+$/.test(nomeJogo);
  const jogo = seguro ? nomeJogo : 'flappy';

  // Permite forçar a orientação via querystring (?orient=landscape|portrait)
  const orientParam = (params.get('orient') || '').toLowerCase();
  const orientacaoForcada = (orientParam === 'landscape' || orientParam === 'portrait') ? orientParam : null;

  const baseJogo   = '/amandapps/' + jogo + '/';
  const runtimeSrc = baseJogo + 'src/Runtime.js';
  const cchPath    = baseJogo + 'resources/' + jogo + '.cch';

  window.__JOGO__ = {
    nome: jogo,
    base: baseJogo,
    runtime: runtimeSrc,
    cch: cchPath,
    orientacaoForcada: orientacaoForcada
  };
  console.log('[jogo_inside] carregando jogo:', jogo, '→', baseJogo, '| orientação forçada:', orientacaoForcada);

  const s = document.createElement('script');
  s.src = runtimeSrc;
  s.onerror = function () {
    console.error('[jogo_inside] falha ao carregar Runtime.js:', runtimeSrc);
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('erroJogo');
    document.getElementById('erroDetalhe').textContent =
      'Verifique se a pasta /amandapps/' + jogo + '/ existe e contém src/Runtime.js';
    el.style.display = 'block';
  };
  document.head.appendChild(s);
})();
</script>

  const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // --------- CONFIG DE NAVEGAÇÃO ---------
  const FIM_DE_JOGO_URL = '/amandapps/fim-de-jogo.html';

  // --------- NOME DO JOGADOR (localStorage, sem cadastro) ---------
  const NOME_STORAGE_KEY = 'amanfa_player_name';
  const NOME_PADRAO = 'Amanfã';

  function sanitizeName(raw) {
    let s = (raw == null) ? '' : String(raw);
    s = s.replace(/[^A-Za-z0-9 ]/g, '');
    s = s.slice(0, 8).trim();
    return s;
  }
  function getPlayerName() {
    try {
      const stored = sanitizeName(localStorage.getItem(NOME_STORAGE_KEY) || '');
      return stored || NOME_PADRAO;
    } catch (e) {
      return NOME_PADRAO;
    }
  }

  // --------- ESTADO ---------
  let navegando = false;

  // --------- NORMALIZAR FLAG ---------
  function normalizarFlag(v) {
    if (v === true  || v === 'true'  || v === 1 || v === '1') return true;
    if (v === false || v === 'false' || v === 0 || v === '0') return false;
    return false;
  }

  // --------- ENVIAR AO SUPABASE ---------
  async function enviarAoBanco(score, gameId) {
    const payload = {
      player_name: getPlayerName(),
      game_id: gameId,
      score: score,
      user_id: null            // sem cadastro, sempre anônimo
    };
    const { error } = await _supabase.from('scores').insert(payload);
    if (error) {
      console.error('[Supabase] Falha ao salvar pontuação:', error);
      return false;
    }
    console.log('[Supabase] Pontuação salva:', payload.player_name, '—', gameId, '—', score);
    return true;
  }

  // --------- IR PARA FIM DE JOGO ---------
  function irParaFimDeJogo({ score, gameId, salvo, salvouHiscore }) {
    if (navegando) return;
    navegando = true;

    try {
      sessionStorage.setItem('fimDeJogo', JSON.stringify({
        nome: getPlayerName(),
        avatar: '🎮',
        score: score,
        gameId: gameId,
        salvo: !!salvo,
        salvouHiscore: !!salvouHiscore,
        jogoUrl: window.location.pathname + window.location.search
      }));
    } catch (e) {
      console.warn('[fim-de-jogo] sessionStorage falhou:', e);
    }

    window.location.href = FIM_DE_JOGO_URL;
  }

  // --------- PONTE FUSION → PÁGINA ---------
  window.receberPontuacaoDoJogo = async function (score, gameId, flag) {
    const pontuacao = Number(score);
    if (!isFinite(pontuacao)) {
      console.warn('[receberPontuacaoDoJogo] score inválido:', score);
      return;
    }
    const jogo = (gameId && String(gameId)) || (window.__JOGO__ && window.__JOGO__.nome) || 'clickteam';
    const deveSalvar = normalizarFlag(flag);

    let salvo = false;
    if (deveSalvar) {
      try { salvo = await enviarAoBanco(pontuacao, jogo); }
      catch (e) { console.error('[Supabase] Erro ao salvar:', e); salvo = false; }
    }

    irParaFimDeJogo({
      score: pontuacao,
      gameId: jogo,
      salvo: salvo,
      salvouHiscore: deveSalvar && salvo
    });
  };
</script>

<!-- 3) Inicia o Runtime + lógica de orientação (retrato/landscape) -->
<script>
  // -------- Lógica de orientação --------
  // O Fusion normalmente define o tamanho do canvas de acordo com o jogo.
  // Se o jogo for landscape (largura > altura), giramos o canvas 90° para
  // caber na tela em retrato, e vice-versa. Se o jogo for retrato, fica normal.

  function aplicarOrientacao() {
    const canvas = document.getElementById('MMFCanvas');
    const wrap = document.getElementById('canvasWrap');
    if (!canvas || !wrap) return;

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    // Dimensões lógicas do jogo (definidas pelo canvas original)
    const lw = canvas.width  || 360;
    const lh = canvas.height || 640;

    // Se o usuário forçou orientação, respeitamos
    const forcada = window.__JOGO__ && window.__JOGO__.orientacaoForcada;

    let ehLandscape;
    if (forcada === 'landscape') ehLandscape = true;
    else if (forcada === 'portrait') ehLandscape = false;
    else ehLandscape = lw > lh; // detecção automática

    // Limpa estilos anteriores
    canvas.style.transform = '';
    canvas.style.width = '';
    canvas.style.height = '';
    canvas.style.maxWidth = '';
    canvas.style.maxHeight = '';
    wrap.style.width = '';
    wrap.style.height = '';

    if (!ehLandscape) {
      // ---- Jogo em retrato: comportamento original ----
      wrap.style.width = vw + 'px';
      wrap.style.height = vh + 'px';
      canvas.style.maxWidth = vw + 'px';
      canvas.style.maxHeight = vh + 'px';
      canvas.style.width = 'auto';
      canvas.style.height = 'auto';
      canvas.style.transform = 'none';
      console.log('[orientacao] retrato (natural)');
    } else {
      // ---- Jogo em landscape: girar 90° ----
      // Após girar, a largura visual do canvas vira a altura lógica (lh)
      // e a altura visual vira a largura lógica (lw).
      // Precisamos encaixar "lh x lw" dentro de "vw x vh".

      const escala = Math.min(vw / lh, vh / lw);

      // Dimensões finais do canvas (antes da rotação)
      const cw = lw * escala; // largura do canvas após escala (antes de girar)
      const ch = lh * escala; // altura do canvas após escala (antes de girar)

      // Como vamos girar, o espaço ocupado na tela será ch (largura) x cw (altura)
      // Centralizamos com o wrap do tamanho da tela e usamos transform.

      wrap.style.width = vw + 'px';
      wrap.style.height = vh + 'px';

      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.style.maxWidth = 'none';
      canvas.style.maxHeight = 'none';
      canvas.style.transform = 'rotate(90deg)';
      // O transform-origin já é center center no CSS

      console.log('[orientacao] landscape → rotacionado 90° | escala:', escala.toFixed(3));
    }
  }

  // Reaplica ao redimensionar / mudar orientação
  window.addEventListener('resize', aplicarOrientacao);
  window.addEventListener('orientationchange', function () {
    // pequeno delay para o navegador atualizar innerWidth/innerHeight
    setTimeout(aplicarOrientacao, 150);
  });

  // Observa mudanças de tamanho do canvas (o Fusion pode redimensionar)
  function observarCanvas() {
    const canvas = document.getElementById('MMFCanvas');
    if (!canvas || typeof ResizeObserver === 'undefined') return;
    const ro = new ResizeObserver(function () {
      // Reaplica a orientação quando o canvas muda de tamanho
      aplicarOrientacao();
    });
    ro.observe(canvas);
  }

  function iniciarRuntime() {
    if (typeof Runtime === 'undefined') {
      return setTimeout(iniciarRuntime, 50);
    }
    const loading = document.getElementById('loading');
    if (loading) loading.style.display = 'none';

    const wrap = document.getElementById('canvasWrap');
    if (wrap) wrap.style.display = 'flex';

    try {
      new Runtime("MMFCanvas", window.__JOGO__.cch);
      console.log('[jogo_inside] Runtime iniciado com', window.__JOGO__.cch);

      // Após o Runtime iniciar, aplica a orientação e começa a observar
      // (damos um pequeno delay para o Fusion definir width/height do canvas)
      setTimeout(function () {
        aplicarOrientacao();
        observarCanvas();
      }, 100);

    } catch (e) {
      console.error('[jogo_inside] erro ao iniciar Runtime:', e);
      const el = document.getElementById('erroJogo');
      document.getElementById('erroDetalhe').textContent = String(e && e.message ? e.message : e);
      el.style.display = 'block';
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', iniciarRuntime);
  } else {
    iniciarRuntime();
  }
</script>
