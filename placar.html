<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Placar — Amand.Apps Games</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Placar</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="placar.html">Placar</a>
      <a href="login.html" id="nav-auth">Entrar</a>
    </nav>
  </header>
  <main>
    <div id="scores-table"></div>

    <section class="test-form">
      <h3>Inserir Hiscore de Teste</h3>
      <form id="test-score-form">
        <input type="text" id="test-game" placeholder="Nome do jogo" value="Flappy Amand" required>
        <input type="text" id="test-name" placeholder="Nome de usuário (opcional)">
        <input type="number" id="test-score" placeholder="Pontuação" required>
        <button type="submit">Inserir</button>
      </form>
      <p id="test-msg"></p>
    </section>
  </main>

  <script>
    const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(location.search);
    const filterGame = urlParams.get('game');

    async function loadScores() {
      let query = supabase.from('scores').select('*').order('score', { ascending: false });
      if (filterGame) query = query.eq('game_name', filterGame);
      const { data } = await query.limit(100);
      
      const games = {};
      (data || []).forEach(s => {
        if (!games[s.game_name]) games[s.game_name] = [];
        games[s.game_name].push(s);
      });

      const container = document.getElementById('scores-table');
      container.innerHTML = Object.entries(games).map(([game, scores]) => `
        <h3>${game}</h3>
        <table>
          <tr><th>#</th><th>Jogador</th><th>Pontos</th></tr>
          ${scores.map((s, i) => `
            <tr><td>${i+1}</td><td>${s.username || 'Anônimo'}</td><td>${s.score}</td></tr>
          `).join('')}
        </table>
      `).join('') || '<p>Nenhuma pontuação ainda.</p>';
    }

    async function checkAuth() {
      const { data: { session } } = await supabase.auth.getSession();
      const navAuth = document.getElementById('nav-auth');
      if (session) {
        const { data: profile } = await supabase.from('profiles').select('username').eq('id', session.user.id).single();
        navAuth.textContent = profile?.username || 'Área Logada';
        navAuth.href = 'area-logada.html';
      }
    }

    document.getElementById('test-score-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const game = document.getElementById('test-game').value;
      const name = document.getElementById('test-name').value || null;
      const score = parseInt(document.getElementById('test-score').value);
      
      const { error } = await supabase.from('scores').insert({ game_name: game, username: name, score });
      const msg = document.getElementById('test-msg');
      if (error) { msg.textContent = 'Erro: ' + error.message; }
      else { msg.textContent = 'Inserido!'; loadScores(); }
    });

    checkAuth();
    loadScores();
  </script>
</body>
</html>
