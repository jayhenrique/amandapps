<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Clickteam Fusion 2.5+ HTML5 – fullscreen (ratio locked)</title>
    <style>
        /* reset + fullscreen backdrop */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;                /* no scrollbars, fullscreen feel */
            background: linear-gradient(to bottom, #eeeeee, #cccccc);
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* fullscreen container that scales the 360x640 canvas without distortion */
        .fullscreen-ratio-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            /* maintain exact 360x640 ratio : use the larger scale factor */
            width: min(100vw, calc(100vh * (360 / 640)));
            height: min(100vh, calc(100vw * (640 / 360)));
            display: flex;
            align-items: center;
            justify-content: center;
            /* subtle shadow / border effect (matches original) */
            border-radius: 7px;
            background-color: #99C;          /* border colour from original */
            border: 1px solid #99C;
            box-shadow: 0 0 4px 4px rgba(0, 0, 0, 0.25);
            overflow: hidden;                 /* keeps inner canvas rounded */
        }

        /* canvas container – fills the ratio box, preserves internal 360x640 */
        #canvas {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #99C;          /* same as border to avoid gaps */
            border-radius: 6px;              /* slightly smaller to sit inside border */
            overflow: hidden;
        }

        /* the actual canvas — stretched to fill container but aspect-ratio locked */
        #MMFCanvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;              /* keep canvas content ratio, but canvas itself stretches */
            background: transparent;
            /* ensure internal canvas resolution (360x640) is scaled smoothly */
            image-rendering: auto;             /* let browser use smooth scaling */
        }

        /* Clickteam hint / footer — hidden for clean fullscreen, but present in DOM */
        .footer-note {
            display: none;
        }

        /* optional: keep original logo hidden (fullscreen immersion) */
        .clickteam-logo {
            display: none;
        }

        /* old browser message – hidden (only shown if file:// protocol, but we override) */
        #bloctxt {
            display: none;
        }
    </style>
</head>
<body>

    <!-- fullscreen wrapper with correct 360:640 ratio -->
    <div class="fullscreen-ratio-box">
        <div id="canvas">
            <canvas id="MMFCanvas" width="360" height="640">
                <p>Your browser does not support Canvas.</p>
            </canvas>
        </div>
    </div>

    <!-- hidden elements (not needed in fullscreen) but kept for reference -->
    <div class="footer-note">
        <p align="center">Clickteam Fusion Developer 2.5+ HTML5 template. Please use final build for distribution.</p>

    <!-- start the runtime exactly as before -->
    <script>
        // Skip the file:// alert (not shown because we use a server; but we keep the check)
        (function() {
            if (window.location.protocol === "file:") {
                // Instead of writing warning, just log and continue for demo (original would throw).
                console.warn("file: protocol detected – runtime may not load resources properly.");
                // The original threw an error; we omit to keep preview functional if someone tests locally.
                // But we preserve the original error block conditionally. (Uncomment next line to restore exact behavior)
                // throw new Error("Cannot run application");
            }
        })();

        // Start runtime on window load
        window.addEventListener("load", function() {
            // Ensure the canvas exists before starting
            const canvas = document.getElementById("MMFCanvas");
            if (canvas) {
                // Original: new Runtime("MMFCanvas", "resources/teste.cch");
                // We keep the same call (resources path must be adjusted in real use)
                try {
                    new Runtime("MMFCanvas", "resources/teste.cch");
                } catch (e) {
                    console.warn("Runtime could not be started (missing resources/teste.cch?).", e);
                }
            }
        });
    </script>
