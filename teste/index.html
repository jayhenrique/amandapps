<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Clickteam Fusion 2.5+ HTML5 – fullscreen (ratio locked)</title>
    <style>
        /* reset + fullscreen backdrop */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(to bottom, #eeeeee, #cccccc);
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* fullscreen container that scales the 360x640 canvas without distortion */
        .fullscreen-ratio-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(100vw, calc(100vh * (360 / 640)));
            height: min(100vh, calc(100vw * (640 / 360)));
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            background-color: #99C;
            border: 1px solid #99C;
            box-shadow: 0 0 4px 4px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #99C;
            border-radius: 6px;
            overflow: hidden;
        }

        #MMFCanvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            background: transparent;
            image-rendering: auto;
        }

        .footer-note { display: none; }
        .clickteam-logo { display: none; }
        #bloctxt { display: none; }

        /* ===================================================== */
        /* MODAL OVERLAY (por cima do jogo, independente do canvas) */
        /* ===================================================== */
        .score-modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(10, 12, 22, 0.82);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 1rem;
            backdrop-filter: blur(3px);
        }
        .score-modal-backdrop.open { display: flex; }

        .score-modal {
            background: #16213e;
            border: 1px solid #2a3a5c;
            border-radius: 14px;
            width: 100%;
            max-width: 380px;
            padding: 1.8rem 1.5rem;
            color: #eaeaea;
            text-align: center;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.6);
            animation: scoreModalIn 0.25s ease-out;
        }
        @keyframes scoreModalIn {
            from { transform: translateY(15px); opacity: 0; }
            to   { transform: translateY(0);   opacity: 1; }
        }

        .score-modal .sm-avatar {
            width: 84px;
            height: 84px;
            margin: 0 auto 0.8rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: linear-gradient(135deg, #0f3460, #1f2b4d);
            border: 3px solid #e94560;
            box-shadow: 0 0 0 5px rgba(233, 69, 96, 0.15);
        }
        .score-modal.anon .sm-avatar {
            border-color: #2a3a5c;
            box-shadow: 0 0 0 5px rgba(138, 143, 163, 0.08);
        }

        .score-modal .sm-name {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.15rem;
            color: #fff;
        }
        .score-modal .sm-sub {
            font-size: 0.8rem;
            color: #8a8fa3;
            margin-bottom: 1.2rem;
        }

        .score-modal .sm-score-box {
            background: #0f3460;
            border: 1px solid #2a3a5c;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 0.6rem;
        }
        .score-modal .sm-score-label {
            font-size: 0.75rem;
            color: #8a8fa3;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.2rem;
        }
        .score-modal .sm-score-value {
            font-size: 2.4rem;
            font-weight: 800;
            color: #f5c518;
            line-height: 1;
        }
        .score-modal .sm-game {
            font-size: 0.8rem;
            color: #8a8fa3;
            margin-bottom: 1.2rem;
        }
        .score-modal .sm-game strong { color: #eaeaea; }

        .score-modal .sm-status {
            font-size: 0.78rem;
            min-height: 1.1em;
            margin-bottom: 0.8rem;
        }
        .score-modal .sm-status.ok { color: #6ee7a8; }
        .score-modal .sm-status.error { color: #ff7b8a; }
        .score-modal .sm-status.loading { color: #8a8fa3; }

        .score-modal .sm-actions {
            display: flex;
            gap: 0.6rem;
            margin-top: 0.4rem;
        }
        .score-modal .sm-actions button {
            flex: 1;
            padding: 0.75rem 0.5rem;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        .score-modal .sm-actions button:hover { opacity: 0.92; }
        .score-modal .sm-actions button:active { transform: scale(0.98); }
        .score-modal .sm-btn-retry { background: #e94560; color: #fff; }
        .score-modal .sm-btn-home  { background: transparent; color: #8a8fa3; border: 1px solid #2a3a5c !important; }
        .score-modal .sm-btn-home:hover { color: #eaeaea; border-color: #8a8fa3 !important; }
    </style>
</head>

    <!-- start the runtime exactly as before -->
    <script>
        // Skip the file:// alert (not shown because we use a server; but we keep the check)
        (function() {
            if (window.location.protocol === "file:") {
                console.warn("file: protocol detected – runtime may not load resources properly.");
            }
        })();

        // Start runtime on window load
        window.addEventListener("load", function() {
            const canvas = document.getElementById("MMFCanvas");
            if (canvas) {
                try {
                    new Runtime("MMFCanvas", "resources/teste.cch");
                } catch (e) {
                    console.warn("Runtime could not be started (missing resources/teste.cch?).", e);
                }
            }
        });
    </script>
