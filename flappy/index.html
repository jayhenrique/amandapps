<body>

    <script>
        // RUNTIMESTART
        // This is where the HTML5 runtime is actually started
        window.addEventListener("load", windowLoaded, false);
        function windowLoaded()
        {
            // Calls the runtime
            // First parameter : name of the canvas element
            // Second parameter : path to the cch file. Images and sounds must lay beside this file
            new Runtime("MMFCanvas", "resources/flappy.cch");
        }
        // RUNTIMESTARTEND
    </script>
    <!-- ===================================================== -->
    <!-- PONTE: Fusion → Supabase → página de fim de jogo        -->
    <!-- Nenhum elemento visual é adicionado na página.          -->
    <!-- ===================================================== -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // --------- CONFIG SUPABASE ---------
        const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --------- CONFIG DE NAVEGAÇÃO ---------
        const FIM_DE_JOGO_URL = '/amandapps/fim-de-jogo.html';
        const JOGO_URL = window.location.pathname.split('/').pop() || 'jogo.html';

        // --------- ESTADO ---------
        let currentUser = null;
        let navegando = false;

        // --------- PERFIL DO USUÁRIO ---------
        function lerPerfilDoUser(user) {
            if (!user) return null;
            const meta = user.user_metadata || {};
            return {
                id: user.id,
                email: user.email,
                username: meta.username || (user.email ? user.email.split('@')[0] : 'usuário'),
                avatar: meta.avatar || '🎮'
            };
        }

        // --------- NORMALIZAR FLAG ---------
        // Aceita: true, false, "true", "false", 1, 0, "1", "0"
        // undefined / null / "" / qualquer outra coisa → false
        function normalizarFlag(v) {
            if (v === true  || v === 'true'  || v === 1 || v === '1') return true;
            if (v === false || v === 'false' || v === 0 || v === '0') return false;
            return false;
        }

        // --------- ENVIAR AO SUPABASE ---------
        async function enviarAoBanco(score, gameId) {
            const payload = {
                player_name: currentUser ? currentUser.username : 'Anônimo',
                game_id: gameId,
                score: score,
                user_id: currentUser ? currentUser.id : null
            };

            const { error } = await _supabase.from('scores').insert(payload);
            if (error) {
                console.error('[Supabase] Falha ao salvar pontuação:', error);
                return false;
            }
            console.log(`[Supabase] Pontuação salva: ${payload.player_name} — ${gameId} — ${score}`);
            return true;
        }

        // --------- IR PARA A PÁGINA DE FIM DE JOGO ---------
        function irParaFimDeJogo({ score, gameId, salvo, salvouHiscore }) {
            if (navegando) return;
            navegando = true;

            const nome = currentUser ? currentUser.username : 'Anônimo';
            const avatar = currentUser ? currentUser.avatar : '🎭';

            try {
                sessionStorage.setItem('fimDeJogo', JSON.stringify({
                    nome: nome,
                    avatar: avatar,
                    score: score,
                    gameId: gameId,
                    salvo: !!salvo,
                    salvouHiscore: !!salvouHiscore,   // <- flag lida pela página de fim
                    jogoUrl: JOGO_URL
                }));
            } catch (e) {
                console.warn('[fim-de-jogo] não foi possível salvar sessionStorage:', e);
            }

            window.location.href = FIM_DE_JOGO_URL;
        }

        // --------- PONTE FUSION → PÁGINA ---------
        // Uso no Fusion:
        //   window.receberPontuacaoDoJogo('12', 'flappy', true)   → salva
        //   window.receberPontuacaoDoJogo('12', 'flappy', false)  → NÃO salva
        //   window.receberPontuacaoDoJogo('12', 'flappy')         → NÃO salva (default = false)
        window.receberPontuacaoDoJogo = async function (score, gameId, flag) {
            const pontuacao = Number(score);
            if (!isFinite(pontuacao)) {
                console.warn('[receberPontuacaoDoJogo] score inválido:', score);
                return;
            }
            const jogo = (gameId && String(gameId)) || 'clickteam';

            // Normaliza a flag — string "false" NÃO vira true
            const deveSalvar = normalizarFlag(flag);

            console.log('[receberPontuacaoDoJogo] score=%o gameId=%o flag=%o (%s) → deveSalvar=%s',
                pontuacao, jogo, flag, typeof flag, deveSalvar);

            let salvo = false;
            if (deveSalvar) {
                try {
                    salvo = await enviarAoBanco(pontuacao, jogo);
                } catch (e) {
                    console.error('[Supabase] Erro ao salvar:', e);
                    salvo = false;
                }
            } else {
                console.log('[receberPontuacaoDoJogo] salvamento ignorado (flag=false)');
            }

            // salvouHiscore = true SOMENTE se a flag era true E o insert deu certo
            irParaFimDeJogo({
                score: pontuacao,
                gameId: jogo,
                salvo: salvo,
                salvouHiscore: deveSalvar && salvo
            });
        };

        // --------- INICIALIZAÇÃO ---------
        (async function init() {
            const { data: { session } } = await _supabase.auth.getSession();
            currentUser = lerPerfilDoUser(session?.user);

            _supabase.auth.onAuthStateChange((_event, session) => {
                currentUser = lerPerfilDoUser(session?.user);
            });
        })();
    </script>
</body>
</html>
