<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Classic | Arcade Central</title>
<style>
  :root {
    --bg: #1a1a2e;
    --accent: #e94560;
    --accent2: #0f3460;
    --text: #eaeaea;
    --text-dim: #8a8fa3;
    --gold: #f5c518;
    --border: #2a3a5c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: var(--text);
  }

  #game {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #0f1728;
    touch-action: none;
  }

  .back-btn-overlay {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 50;
    background: rgba(15, 52, 96, 0.85);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 0.55rem 1rem;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    text-decoration: none;
    backdrop-filter: blur(6px);
    transition: background 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .back-btn-overlay:hover {
    background: var(--accent);
    transform: translateY(-1px);
    text-decoration: none;
  }

  #status {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 40;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.85);
    background: rgba(0,0,0,0.35);
    padding: 0.3rem 0.8rem;
    border-radius: 20px;
    min-height: 1.4em;
    text-align: center;
    pointer-events: none;
    max-width: 90vw;
  }

  #overlay {
    position: fixed;
    inset: 0;
    z-index: 60;
    background: rgba(0,0,0,0.72);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    text-align: center;
    padding: 1.5rem;
    backdrop-filter: blur(4px);
  }
  #overlay.hidden { display: none; }
  #overlay h2 {
    font-size: 2rem;
    color: var(--gold);
    letter-spacing: 1px;
  }
  #overlay p { font-size: 0.95rem; color: var(--text); max-width: 340px; }
  #overlay .score-big {
    font-size: 3rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }
  #overlay .score-label {
    font-size: 0.85rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #overlay .buttons {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    margin-top: 0.5rem;
    width: 100%;
    max-width: 240px;
  }
  #overlay button,
  #overlay a.btn {
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    display: block;
    text-align: center;
    transition: opacity 0.2s;
  }
  #overlay button:hover,
  #overlay a.btn:hover { opacity: 0.9; text-decoration: none; }
  #start-btn { background: var(--accent); color: #fff; }
  #home-btn {
    background: var(--accent2);
    color: var(--text);
    border: 1px solid var(--border);
  }

  .hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    font-size: 0.75rem;
    color: rgba(255,255,255,0.7);
    text-align: center;
    pointer-events: none;
    max-width: 90vw;
  }
</style>
</head>
<body>

<a class="back-btn-overlay" href="../index.html">← Voltar</a>

<canvas id="game"></canvas>

<div id="status"></div>

<div id="overlay">
  <h2 id="overlay-title">🐍 Snake Classic</h2>
  <p id="overlay-msg">Use as setas ou WASD para mover. Coma as maçãs!</p>
  <div id="overlay-score" style="display:none;">
    <div class="score-label">Sua pontuação</div>
    <div class="score-big" id="final-score">0</div>
  </div>
  <div class="buttons">
    <button id="start-btn">Começar</button>
    <a id="home-btn" class="btn" href="../index.html" style="display:none;">← Voltar para o Arcade</a>
  </div>
</div>

<div class="hint" id="hint">Setas / WASD para mover · Espaço para pausar</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ============================================
  // CONFIGURAÇÃO
  // ============================================
  const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const GAME_ID = 'snake';

  // ============================================
  // ELEMENTOS
  // ============================================
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayMsg = document.getElementById('overlay-msg');
  const overlayScore = document.getElementById('overlay-score');
  const finalScoreEl = document.getElementById('final-score');
  const startBtn = document.getElementById('start-btn');
  const homeBtn = document.getElementById('home-btn');
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');

  // ============================================
  // CANVAS RESPONSIVO
  // ============================================
  let W, H, DPR;
  function resizeCanvas() {
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (snake) draw();
  }
  window.addEventListener('resize', () => {
    resizeCanvas();
    // Recalcula o grid se o tamanho mudar
    calcularGrid();
  });

  // ============================================
  // GRID
  // ============================================
  let CELL = 24;      // tamanho da célula (px)
  let COLS, ROWS;     // quantas células cabem na tela

  function calcularGrid() {
    // Ajusta CELL para caber um número razoável de células na tela
    const alvoCols = Math.floor(W / 28);
    const alvoRows = Math.floor(H / 28);
    CELL = Math.floor(Math.min(W / alvoCols, H / alvoRows));
    // Limita para não ficar nem muito grande nem muito pequeno
    CELL = Math.max(16, Math.min(CELL, 40));
    COLS = Math.floor(W / CELL);
    ROWS = Math.floor(H / CELL);
    // Centraliza o grid
    offsetX = Math.floor((W - COLS * CELL) / 2);
    offsetY = Math.floor((H - ROWS * CELL) / 2);
  }
  let offsetX = 0, offsetY = 0;

  // ============================================
  // ESTADO DO JOGO
  // ============================================
  let snake, dir, nextDir, apple, score, gameRunning, gameOver;
  let moveInterval, lastMoveTime, paused;

  function resetGame() {
    calcularGrid();
    const cx = Math.floor(COLS / 2);
    const cy = Math.floor(ROWS / 2);
    snake = [
      { x: cx, y: cy },
      { x: cx - 1, y: cy },
      { x: cx - 2, y: cy },
    ];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    score = 0;
    gameRunning = false;
    gameOver = false;
    paused = false;
    statusEl.textContent = '';
    spawnApple();
    // Velocidade inicial: 150ms por movimento
    moveInterval = 150;
    lastMoveTime = 0;
  }

  function spawnApple() {
    const empty = [];
    for (let x = 0; x < COLS; x++) {
      for (let y = 0; y < ROWS; y++) {
        if (!snake.some(s => s.x === x && s.y === y)) empty.push({ x, y });
      }
    }
    if (empty.length === 0) {
      // Vitória! (tela cheia)
      endGame(true);
      return;
    }
    apple = empty[Math.floor(Math.random() * empty.length)];
  }

  // ============================================
  // CONTROLES
  // ============================================
  function setDir(x, y) {
    // Impede reversão direta
    if (dir.x === -x && dir.y === -y) return;
    // Se já está indo nessa direção, ignora
    if (dir.x === x && dir.y === y) return;
    nextDir = { x, y };
  }

  document.addEventListener('keydown', (e) => {
    switch (e.code) {
      case 'ArrowUp': case 'KeyW': e.preventDefault(); setDir(0, -1); break;
      case 'ArrowDown': case 'KeyS': e.preventDefault(); setDir(0, 1); break;
      case 'ArrowLeft': case 'KeyA': e.preventDefault(); setDir(-1, 0); break;
      case 'ArrowRight': case 'KeyD': e.preventDefault(); setDir(1, 0); break;
      case 'Space':
        e.preventDefault();
        if (!gameRunning && !gameOver) startGame();
        else if (gameRunning) togglePause();
        break;
    }
  });

  // Suporte a swipe no mobile
  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStartX = t.clientX;
    touchStartY = t.clientY;
    if (!gameRunning && !gameOver) startGame();
  }, { passive: true });

  canvas.addEventListener('touchend', (e) => {
    if (!gameRunning) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return; // toque curto, ignora
    if (Math.abs(dx) > Math.abs(dy)) {
      setDir(dx > 0 ? 1 : -1, 0);
    } else {
      setDir(0, dy > 0 ? 1 : -1);
    }
  }, { passive: true });

  startBtn.addEventListener('click', () => {
    if (!gameRunning) startGame();
  });

  function togglePause() {
    paused = !paused;
    statusEl.textContent = paused ? '⏸ Pausado (espaço para continuar)' : '';
  }

  // ============================================
  // INÍCIO / FIM
  // ============================================
  function startGame() {
    resetGame();
    gameRunning = true;
    gameOver = false;
    paused = false;
    overlay.classList.add('hidden');
    overlayScore.style.display = 'none';
    homeBtn.style.display = 'none';
    hintEl.style.display = 'block';
    lastMoveTime = performance.now();
    requestAnimationFrame(loop);
  }

  function endGame(vitoria = false) {
    gameRunning = false;
    gameOver = true;
    paused = false;
    overlay.classList.remove('hidden');
    overlayTitle.textContent = vitoria ? '🏆 Você venceu!' : 'Fim de jogo!';
    overlayMsg.textContent = vitoria ? 'Você ocupou a tela inteira!' : 'Você bateu em si mesmo ou na parede.';
    overlayScore.style.display = 'block';
    finalScoreEl.textContent = score;
    startBtn.textContent = 'Jogar de novo';
    homeBtn.style.display = 'block';
    hintEl.style.display = 'none';
    statusEl.textContent = '';

    enviarPontuacao(score);
  }

  // ============================================
  // ENVIO DA PONTUAÇÃO
  // ============================================
  async function enviarPontuacao(pontos) {
    if (pontos <= 0) {
      statusEl.textContent = 'Pontuação 0 não foi enviada.';
      return;
    }
    statusEl.textContent = 'Enviando pontuação...';

    const { data: { user } } = await _supabase.auth.getUser();
    const playerName = user ? user.email.split('@')[0] : 'Anônimo';

    const { error } = await _supabase
      .from('scores')
      .insert({ player_name: playerName, game_id: GAME_ID, score: pontos });

    if (error) {
      console.error(error);
      statusEl.textContent = 'Erro ao enviar: ' + error.message;
    } else {
      statusEl.textContent = `✅ Pontuação de ${pontos} enviada como "${playerName}"!`;
    }
  }

  // ============================================
  // ATUALIZAÇÃO LÓGICA
  // ============================================
  function update(now) {
    if (!gameRunning || paused) return;

    if (now - lastMoveTime < moveInterval) return;
    lastMoveTime = now;

    // Aplica a direção pendente
    dir = nextDir;

    // Nova cabeça
    const head = snake[0];
    const newHead = { x: head.x + dir.x, y: head.y + dir.y };

    // Colisão com parede
    if (newHead.x < 0 || newHead.x >= COLS || newHead.y < 0 || newHead.y >= ROWS) {
      endGame();
      return;
    }

    // Colisão consigo mesmo (ignora a cauda que vai sair)
    const bodyToCheck = snake.slice(0, -1);
    if (bodyToCheck.some(s => s.x === newHead.x && s.y === newHead.y)) {
      endGame();
      return;
    }

    snake.unshift(newHead);

    // Comeu maçã?
    if (apple && newHead.x === apple.x && newHead.y === apple.y) {
      score++;
      // Aumenta a velocidade gradualmente
      moveInterval = Math.max(60, 150 - score * 4);
      spawnApple();
    } else {
      snake.pop();
    }
  }

  // ============================================
  // DESENHO
  // ============================================
  function draw() {
    if (!W || !H) return;

    // Fundo
    ctx.fillStyle = '#0f1728';
    ctx.fillRect(0, 0, W, H);

    // Grid sutil
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= COLS; x++) {
      ctx.beginPath();
      ctx.moveTo(offsetX + x * CELL, offsetY);
      ctx.lineTo(offsetX + x * CELL, offsetY + ROWS * CELL);
      ctx.stroke();
    }
    for (let y = 0; y <= ROWS; y++) {
      ctx.beginPath();
      ctx.moveTo(offsetX, offsetY + y * CELL);
      ctx.lineTo(offsetX + COLS * CELL, offsetY + y * CELL);
      ctx.stroke();
    }

    // Borda da arena
    ctx.strokeStyle = 'rgba(233, 69, 96, 0.4)';
    ctx.lineWidth = 3;
    ctx.strokeRect(offsetX, offsetY, COLS * CELL, ROWS * CELL);

    // Maçã
    if (apple) {
      const ax = offsetX + apple.x * CELL + CELL / 2;
      const ay = offsetY + apple.y * CELL + CELL / 2;
      const r = CELL * 0.38;
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(ax, ay, r, 0, Math.PI * 2);
      ctx.fill();
      // brilho
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(ax - r * 0.3, ay - r * 0.3, r * 0.25, 0, Math.PI * 2);
      ctx.fill();
      // talinho
      ctx.strokeStyle = '#2e8b57';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(ax, ay - r);
      ctx.lineTo(ax + 2, ay - r - 5);
      ctx.stroke();
    }

    // Cobra
    if (snake) {
      snake.forEach((s, i) => {
        const x = offsetX + s.x * CELL;
        const y = offsetY + s.y * CELL;
        const isHead = i === 0;
        // Corpo com gradiente
        const t = i / Math.max(1, snake.length);
        if (isHead) {
          ctx.fillStyle = '#f5c518';
        } else {
          // Verde que escurece conforme vai para a cauda
          const g = Math.floor(200 - t * 100);
          ctx.fillStyle = `rgb(46, ${g}, 87)`;
        }
        const pad = isHead ? 1 : 2;
        ctx.fillRect(x + pad, y + pad, CELL - pad * 2, CELL - pad * 2);

        // Olhos na cabeça
        if (isHead) {
          ctx.fillStyle = '#000';
          const eyeSize = CELL * 0.12;
          // Posição dos olhos depende da direção
          let e1x, e1y, e2x, e2y;
          const cx = x + CELL / 2;
          const cy = y + CELL / 2;
          const off = CELL * 0.2;
          if (dir.x === 1) {        // direita
            e1x = cx + off; e1y = cy - off;
            e2x = cx + off; e2y = cy + off;
          } else if (dir.x === -1) { // esquerda
            e1x = cx - off; e1y = cy - off;
            e2x = cx - off; e2y = cy + off;
          } else if (dir.y === 1) {  // baixo
            e1x = cx - off; e1y = cy + off;
            e2x = cx + off; e2y = cy + off;
          } else {                   // cima
            e1x = cx - off; e1y = cy - off;
            e2x = cx + off; e2y = cy - off;
          }
          ctx.beginPath();
          ctx.arc(e1x, e1y, eyeSize, 0, Math.PI * 2);
          ctx.arc(e2x, e2y, eyeSize, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    // Pontuação em jogo
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 4;
    ctx.font = 'bold 36px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeText(score, W / 2, 40);
    ctx.fillText(score, W / 2, 40);

    // Indicador de pausa
    if (paused) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 48px sans-serif';
      ctx.fillText('⏸', W / 2, H / 2);
    }
  }

  // ============================================
  // LOOP
  // ============================================
  function loop(now) {
    update(now);
    draw();
    if (gameRunning) requestAnimationFrame(loop);
  }

  // ============================================
  // INIT
  // ============================================
  resizeCanvas();
  calcularGrid();
  resetGame();
  draw();
  overlayTitle.textContent = '🐍 Snake Classic';
  overlayMsg.textContent = 'Use as setas ou WASD para mover. Coma as maçãs!';
  overlayScore.style.display = 'none';
  startBtn.textContent = 'Começar';
  homeBtn.style.display = 'none';
</script>

</body>
</html>
