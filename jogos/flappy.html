<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Flappy Amand</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f0f1a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: system-ui, sans-serif;
    }
    #game-wrapper {
      position: relative;
      width: 100vw;
      max-width: calc(100vh * 9 / 16);
      height: 100vh;
      aspect-ratio: 9 / 16;
      background: #1a1a2e;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,0.6);
      color: white;
      text-align: center;
      gap: 12px;
    }
    #ui-overlay.hidden { display: none; }
    #ui-overlay h2 { font-size: 28px; }
    #ui-overlay button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background: #e94560;
      color: white;
      cursor: pointer;
    }
    #ui-overlay button.secondary { background: #16213e; }
    #back-btn {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      padding: 8px 16px;
      background: rgba(0,0,0,0.5);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game-canvas"></canvas>
    <button id="back-btn">← Menu</button>
    <div id="ui-overlay">
      <h2 id="overlay-title">Flappy Amand</h2>
      <p id="overlay-score"></p>
      <button id="overlay-btn">Jogar</button>
      <button id="overlay-menu-btn" class="secondary hidden">Voltar ao Menu</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('ui-overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayScore = document.getElementById('overlay-score');
    const overlayBtn = document.getElementById('overlay-btn');
    const overlayMenuBtn = document.getElementById('overlay-menu-btn');

    let W, H;
    function resize() {
      const rect = canvas.parentElement.getBoundingClientRect();
      W = canvas.width = rect.width;
      H = canvas.height = rect.height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Estado do jogo
    let bird = { x: 0, y: 0, vy: 0, gravity: 0.5, jump: -8, size: 30 };
    let pipes = [];
    let score = 0;
    let gameState = 'menu'; // menu, playing, gameover
    let frame = 0;
    const PIPE_W = 60;
    const PIPE_GAP = 140;
    const PIPE_SPEED = 2.5;

    function resetGame() {
      bird.x = W * 0.25;
      bird.y = H / 2;
      bird.vy = 0;
      pipes = [];
      score = 0;
      frame = 0;
    }

    function spawnPipe() {
      const minTop = 60;
      const maxTop = H - PIPE_GAP - 60;
      const top = minTop + Math.random() * (maxTop - minTop);
      pipes.push({ x: W, top, scored: false });
    }

    function update() {
      if (gameState !== 'playing') return;

      bird.vy += bird.gravity;
      bird.y += bird.vy;

      // Chão e teto
      if (bird.y < 0 || bird.y + bird.size > H) {
        endGame();
        return;
      }

      // Pipes
      if (frame % 90 === 0) spawnPipe();
      
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= PIPE_SPEED;

        // Colisão
        if (bird.x + bird.size > p.x && bird.x < p.x + PIPE_W) {
          if (bird.y < p.top || bird.y + bird.size > p.top + PIPE_GAP) {
            endGame();
            return;
          }
        }

        // Pontuação
        if (!p.scored && p.x + PIPE_W < bird.x) {
          p.scored = true;
          score++;
        }

        // Remover pipes fora da tela
        if (p.x + PIPE_W < 0) pipes.splice(i, 1);
      }

      frame++;
    }

    function draw() {
      // Fundo
      ctx.fillStyle = '#16213e';
      ctx.fillRect(0, 0, W, H);

      // Pipes
      ctx.fillStyle = '#4ecca3';
      pipes.forEach(p => {
        ctx.fillRect(p.x, 0, PIPE_W, p.top);
        ctx.fillRect(p.x, p.top + PIPE_GAP, PIPE_W, H - p.top - PIPE_GAP);
      });

      // Bird
      ctx.fillStyle = '#e94560';
      ctx.beginPath();
      ctx.arc(bird.x + bird.size/2, bird.y + bird.size/2, bird.size/2, 0, Math.PI * 2);
      ctx.fill();

      // Score
      ctx.fillStyle = 'white';
      ctx.font = '32px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(score, W / 2, 60);

      if (gameState === 'menu') {
        // Já mostrado pelo overlay
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    async function endGame() {
      gameState = 'gameover';
      overlayTitle.textContent = 'Fim de Jogo!';
      overlayScore.textContent = `Pontuação: ${score}`;
      overlayBtn.textContent = 'Jogar Novamente';
      overlayMenuBtn.classList.remove('hidden');
      overlay.classList.remove('hidden');

      // Salvar score
      const { data: { session } } = await supabase.auth.getSession();
      let username = null;
      let userId = null;
      if (session) {
        userId = session.user.id;
        const { data: profile } = await supabase.from('profiles').select('username').eq('id', userId).single();
        username = profile?.username;
      }

      // Inserir em scores
      await supabase.from('scores').insert({
        user_id: userId,
        username: username,
        game_name: 'Flappy Amand',
        score: score
      });

      // Inserir em activities
      await supabase.from('activities').insert({
        user_id: userId,
        username: username,
        game_name: 'Flappy Amand',
        score: score,
        message: username ? `${username} fez ${score} pontos` : `Um Amandfã fez ${score} pontos`
      });
    }

    function startGame() {
      resetGame();
      gameState = 'playing';
      overlay.classList.add('hidden');
    }

    overlayBtn.onclick = () => {
      if (gameState === 'gameover') {
        startGame();
      } else {
        startGame();
      }
    };

    overlayMenuBtn.onclick = () => location.href = 'index.html';
    document.getElementById('back-btn').onclick = () => location.href = 'index.html';

    // Input
    canvas.addEventListener('click', () => {
      if (gameState === 'playing') {
        bird.vy = bird.jump;
      }
    });
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (gameState === 'playing') bird.vy = bird.jump;
    }, { passive: false });

    // Iniciar loop
    resetGame();
    gameState = 'menu';
    overlayTitle.textContent = 'Flappy Amand';
    overlayScore.textContent = 'Clique para começar';
    overlayBtn.textContent = 'Jogar';
    overlayMenuBtn.classList.add('hidden');
    loop();
  </script>
</body>
</html>
