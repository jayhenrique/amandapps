<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Amand.Apps Games</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header>
    <h1>Entrar</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="placar.html">Placar</a>
      <a href="login.html">Entrar</a>
    </nav>
  </header>
  <main>
    <div class="auth-tabs">
      <button id="tab-login" class="active">Login</button>
      <button id="tab-register">Criar Conta</button>
    </div>

    <form id="login-form" class="auth-form">
      <input type="email" id="login-email" placeholder="Email" required>
      <input type="password" id="login-password" placeholder="Senha" required>
      <button type="submit">Entrar</button>
      <p id="login-msg"></p>
    </form>

    <form id="register-form" class="auth-form hidden">
      <input type="email" id="reg-email" placeholder="Email" required>
      <input type="text" id="reg-username" placeholder="Nome de usuário" required>
      <input type="password" id="reg-password" placeholder="Senha (mín. 6 caracteres)" required minlength="6">
      <button type="submit">Criar Conta</button>
      <p id="reg-msg"></p>
    </form>
  </main>

  <script>
    const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('tab-login').onclick = () => {
      document.getElementById('login-form').classList.remove('hidden');
      document.getElementById('register-form').classList.add('hidden');
      document.getElementById('tab-login').classList.add('active');
      document.getElementById('tab-register').classList.remove('active');
    };
    document.getElementById('tab-register').onclick = () => {
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('register-form').classList.remove('hidden');
      document.getElementById('tab-register').classList.add('active');
      document.getElementById('tab-login').classList.remove('active');
    };

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      const msg = document.getElementById('login-msg');
      if (error) { msg.textContent = 'Erro: ' + error.message; }
      else { location.href = 'area-logada.html'; }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('reg-email').value;
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const msg = document.getElementById('reg-msg');

      // Verificar username
      const { data: available } = await supabase.rpc('check_username_available', { username_to_check: username });
      if (!available) {
        msg.textContent = 'Este nome de usuário já existe. Tente outro.';
        return;
      }

      // Criar usuário
      const { data: authData, error: authError } = await supabase.auth.signUp({ email, password });
      if (authError) { msg.textContent = 'Erro: ' + authError.message; return; }

      // Criar perfil
      const { error: profileError } = await supabase.from('profiles').insert({
        id: authData.user.id,
        username: username
      });
      if (profileError) { msg.textContent = 'Erro ao criar perfil: ' + profileError.message; return; }

      msg.textContent = 'Conta criada! Redirecionando...';
      setTimeout(() => location.href = 'area-logada.html', 1000);
    });
  </script>
</body>
</html>
