<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jogo — Arcade Central</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: #1A1A2E;
            color: #eaeaea;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            min-height: 100%;
        }

        a { color: #e94560; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== LAYOUT PRINCIPAL ===== */
        .game-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 2rem;
            align-items: start;
            width: 100%;
            margin-bottom: 2rem;
        }

        @media (max-width: 720px) {
            .game-layout {
                grid-template-columns: 1fr;
                gap: 1.2rem;
            }
        }

        /* ===== COLUNA DA IMAGEM ===== */
        .col-image {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .thumb-wrap {
            width: 100%;
            max-width: 320px;
            aspect-ratio: 300 / 250;
            border-radius: 12px;
            overflow: hidden;
            background: #0f3460;
            border: 1px solid #2a3a5c;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 0 auto;
        }
        .thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .thumb-wrap .thumb-fallback {
            font-size: 5rem;
            color: #8a8fa3;
            display: none;
        }
        .thumb-wrap.error img { display: none; }
        .thumb-wrap.error .thumb-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        /* ===== COLUNA DE INFORMAÇÕES ===== */
        .col-info {
            width: 100%;
            display: flex;
            flex-direction: column;
        }

        .game-title {
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .descricao {
            color: #8a8fa3;
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 1.5rem;
        }

        /* ===== "PLAYING AS" hint ===== */
        .playing-as {
            font-size: 0.82rem;
            color: #8a8fa3;
            margin-bottom: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }
        .playing-as strong {
            color: #f5c518;
            font-weight: 700;
        }
        .playing-as a {
            font-size: 0.78rem;
            color: #e94560;
            margin-left: 0.2rem;
        }

        /* ===== BOTÃO PLAY ===== */
        .btn-play {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: #e94560;
            color: #fff;
            padding: 0.9rem 2rem;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.35);
            transition: transform 0.12s, box-shadow 0.12s;
            text-decoration: none;
            width: 100%;
            max-width: 320px;
            margin-bottom: 1rem;
        }
        .btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 40px rgba(233, 69, 96, 0.5);
            text-decoration: none;
        }
        .btn-play:active { transform: translateY(0); }

        /* ===== COMO JOGAR ===== */
        .como-jogar {
            width: 100%;
            max-width: 320px;
            color: #8a8fa3;
            font-size: 0.85rem;
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        .como-jogar strong {
            display: block;
            color: #eaeaea;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        /* ===== BOTÃO SAIR ===== */
        .btn-sair {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #0f3460;
            border: 1px solid #2a3a5c;
            color: #eaeaea;
            padding: 0.55rem 1.6rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            transition: background 0.15s, transform 0.12s, color 0.15s;
            text-decoration: none;
            width: 100%;
            max-width: 320px;
        }
        .btn-sair:hover {
            background: #e94560;
            color: #fff;
            text-decoration: none;
            transform: translateY(-1px);
        }
        .btn-sair:active { transform: translateY(0); }

        /* ===== MOBILE: centraliza tudo ===== */
        @media (max-width: 720px) {
            .col-info {
                align-items: center;
                text-align: center;
            }
            .descricao {
                text-align: left;
            }
            .playing-as { justify-content: center; }
        }

        /* ===== RANKING ===== */
        .section-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            width: 100%;
        }
        .section-title::before {
            content: '';
            width: 4px; height: 1.2rem;
            background: #e94560;
            border-radius: 2px;
        }

        .lb {
            background: #16213e;
            border: 1px solid #2a3a5c;
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
        }
        .lb table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }
        .lb th, .lb td {
            padding: 0.65rem 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .lb th {
            background: #0f3460;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a8fa3;
            font-weight: 700;
        }
        .lb tr:last-child td { border-bottom: none; }
        .lb .rank { color: #8a8fa3; width: 3rem; }
        .lb .player { font-weight: 600; }
        .lb .score { text-align: right; color: #f5c518; font-weight: 700; }
        .lb tr:nth-child(1) .player { color: #f5c518; }
        .lb tr:nth-child(2) .player { color: #d4d4d4; }
        .lb tr:nth-child(3) .player { color: #cd8f5f; }
        .lb .empty {
            text-align: center;
            color: #8a8fa3;
            padding: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="container" id="conteudo">
        <p style="color:#8a8fa3;">Carregando...</p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // =====================================================
        // CONFIG
        // =====================================================
        const HOME_URL      = '/amandapps/';
        const THUMB_DIR     = '/amandapps/thumbs-assets';
        const INFO_JSON_URL = '/amandapps/jogos-info.json';

        // jogo_inside.html fica em /amandapps/jogo_inside.html
        const JOGO_INSIDE_URL = '/amandapps/jogo_inside.html';

        const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // =====================================================
        // NOME DO JOGADOR (compartilhado com index/jogo_inside/fim-de-jogo)
        // =====================================================
        const NOME_STORAGE_KEY = 'amanfa_player_name';
        const NOME_PADRAO = 'Amanfã';

        function sanitizeName(raw) {
            let s = (raw == null) ? '' : String(raw);
            s = s.replace(/[^A-Za-z0-9 ]/g, '');
            s = s.slice(0, 8).trim();
            return s;
        }
        function getPlayerName() {
            try {
                const stored = sanitizeName(localStorage.getItem(NOME_STORAGE_KEY) || '');
                return stored || NOME_PADRAO;
            } catch (e) {
                return NOME_PADRAO;
            }
        }

        // =====================================================
        // HELPERS
        // =====================================================
        function getGameIdFromURL() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            if (!id) return null;
            return id.trim().replace(/[^a-zA-Z0-9_-]/g, '');
        }

        function escapeHTML(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        // =====================================================
        // 10º COLOCADO — salva em localStorage
        // =====================================================
        function definirDecimoValor(valor, gameId) {
            try {
                localStorage.setItem('decimo_score', String(valor));
                localStorage.setItem('decimo_score_game', String(gameId || ''));
            } catch (e) {
                console.warn('[jogo] localStorage indisponível:', e);
            }
            window.DECIMO_SCORE = valor;

            let dbg = document.getElementById('debug-decimo');
            if (!dbg) {
                dbg = document.createElement('div');
                dbg.id = 'debug-decimo';
                dbg.style.cssText = `
                    margin-top: 1.5rem;
                    padding: 0.75rem 1rem;
                    background: #0f3460;
                    border: 1px solid #e94560;
                    border-radius: 8px;
                    font-family: ui-monospace, monospace;
                    font-size: 0.85rem;
                    color: #f5c518;
                    word-break: break-all;
                    width: 100%;
                `;
                document.querySelector('.container').appendChild(dbg);
            }
            dbg.textContent = `DEBUG → 10º colocado (game_id: ${gameId || '—'}): ${Number(valor).toLocaleString('pt-BR')} (raw: ${valor})`;

            console.log('[jogo] 10º colocado salvo em localStorage:', valor, 'game_id:', gameId);
        }

        // =====================================================
        // CARREGAR
        // =====================================================
        async function carregar() {
            const gameId = getGameIdFromURL();

            let info = null;
            if (gameId) {
                try {
                    const resp = await fetch(INFO_JSON_URL, { cache: 'no-cache' });
                    if (resp.ok) {
                        const all = await resp.json();
                        info = all[gameId] || null;
                    }
                } catch (e) {
                    console.warn('[jogo] não foi possível carregar jogos-info.json:', e);
                }
            }

            const dados = {
                titulo:    info?.titulo    || 'Jogo Desconhecido',
                descricao: info?.descricao || 'Este jogo ainda não possui descrição disponível. Mas você pode jogar e se divertir mesmo assim!',
                categoria: info?.categoria || '',
                controles: info?.controles || 'Use o mouse e o teclado para jogar.',
                autor:     info?.autor     || ''
            };

            const thumbUrl = gameId
                ? `${THUMB_DIR}/${encodeURIComponent(gameId)}.png`
                : '';

            const playUrl = gameId
                ? `${JOGO_INSIDE_URL}?jogo=${encodeURIComponent(gameId)}`
                : '#';

            const nomeJogador = escapeHTML(getPlayerName());

            document.getElementById('conteudo').innerHTML = `
                <div class="game-layout">

                    <!-- COLUNA ESQUERDA: IMAGEM -->
                    <div class="col-image">
                        <div class="thumb-wrap" id="thumb-wrap">
                            ${thumbUrl ? `<img id="thumb-img" src="${thumbUrl}" alt="${escapeHTML(dados.titulo)}">` : ''}
                            <div class="thumb-fallback">🎮</div>
                        </div>
                    </div>

                    <!-- COLUNA DIREITA: INFO -->
                    <div class="col-info">
                        <h1 class="game-title">${escapeHTML(dados.titulo)}</h1>
                        <p class="descricao">${escapeHTML(dados.descricao)}</p>

                        <div class="playing-as">
                            🎮 Playing as <strong>${nomeJogador}</strong>
                            <a href="${HOME_URL}#perfil">change</a>
                        </div>

                        <a class="btn-play" href="${playUrl}">▶ PLAY</a>

                        <div class="como-jogar">
                            <strong>Como jogar</strong>
                            ${escapeHTML(dados.controles)}
                        </div>

                        <a class="btn-sair" href="${HOME_URL}">SAIR</a>
                    </div>

                </div>

                <h2 class="section-title">Melhores pontuações</h2>
                <div class="lb">
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Jogador</th>
                                <th style="text-align:right;">Pontos</th>
                            </tr>
                        </thead>
                        <tbody id="lb-body">
                            <tr><td colspan="3" class="empty">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            `;

            // Trata erro da thumb
            const thumbImg = document.getElementById('thumb-img');
            const thumbWrap = document.getElementById('thumb-wrap');
            if (thumbImg) {
                thumbImg.onerror = () => {
                    thumbWrap.classList.add('error');
                    thumbImg.removeAttribute('src');
                    console.warn('[jogo] thumb não encontrada:', thumbUrl);
                };
            } else {
                thumbWrap.classList.add('error');
            }

            await carregarLeaderboard(gameId);
        }

        async function carregarLeaderboard(gameId) {
            const tbody = document.getElementById('lb-body');
            if (!tbody) return;

            if (!gameId) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty">Nenhuma pontuação disponível.</td></tr>`;
                definirDecimoValor(0, '');
                return;
            }

            const { data, error } = await _supabase
                .from('scores')
                .select('player_name, score, created_at')
                .eq('game_id', gameId)
                .order('score', { ascending: false })
                .limit(10);

            if (error) {
                console.error('[jogo] erro ao buscar leaderboard:', error);
                tbody.innerHTML = `<tr><td colspan="3" class="empty">Erro ao carregar pontuações.</td></tr>`;
                definirDecimoValor(0, gameId);
                return;
            }

            if (!data || data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="empty">Nenhuma pontuação ainda. Seja o primeiro!</td></tr>`;
                definirDecimoValor(0, gameId);
                return;
            }

            tbody.innerHTML = data.map((row, i) => `
                <tr>
                    <td class="rank">${i + 1}</td>
                    <td class="player">${escapeHTML(row.player_name || NOME_PADRAO)}</td>
                    <td class="score">${Number(row.score).toLocaleString('pt-BR')}</td>
                </tr>
            `).join('');

            const valorDecimo = (data.length >= 10) ? (Number(data[9].score) || 0) : 0;
            definirDecimoValor(valorDecimo, gameId);
        }

        document.addEventListener('DOMContentLoaded', carregar);
    </script>

</body>
</html>
