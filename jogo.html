<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fim de Jogo — Arcade Central</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            background: #1A1A2E;
            color: #eaeaea;
            font-family: 'Segoe UI', Arial, Helvetica, sans-serif;
            min-height: 100%;
        }

        a { color: #e94560; text-decoration: none; }
        a:hover { text-decoration: underline; }

        /* ---------- Header ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
            border-bottom: 3px solid #e94560;
            padding: 0.9rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .topbar .logo { font-size: 1.2rem; font-weight: 800; letter-spacing: 1px; }
        .topbar .logo span { color: #e94560; }
        .topbar .back {
            color: #8a8fa3;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .topbar .back:hover { color: #e94560; text-decoration: none; }

        /* ---------- Container ---------- */
        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 1.5rem;
        }

        /* ---------- Card principal ---------- */
        .gameover-card {
            background: #16213e;
            border: 1px solid #2a3a5c;
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .gameover-card h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 0.4rem;
            letter-spacing: 1px;
        }
        .gameover-card h1.recorde {
            color: #f5c518;
            text-shadow: 0 0 20px rgba(245,197,24,0.5);
        }
        .gameover-card .subtitulo {
            color: #8a8fa3;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        /* ---------- Placar ---------- */
        .placar-box {
            background: #0f3460;
            border-radius: 12px;
            padding: 1.5rem 1rem;
            margin-bottom: 1.5rem;
        }
        .placar-box .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8a8fa3;
            margin-bottom: 0.4rem;
        }
        .placar-box .valor {
            font-size: 3rem;
            font-weight: 800;
            color: #e94560;
            line-height: 1;
        }
        .placar-box .valor.recorde { color: #f5c518; }

        /* ---------- Mensagem de recorde ---------- */
        .msg-recorde {
            background: rgba(245,197,24,0.1);
            border: 1px solid rgba(245,197,24,0.4);
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            color: #f5c518;
            font-weight: 700;
        }
        .msg-recorde .emoji { font-size: 1.5rem; display: block; margin-bottom: 0.3rem; }

        .msg-normal {
            color: #8a8fa3;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .msg-normal strong { color: #eaeaea; }

        /* ---------- Formulário ---------- */
        .form-score {
            display: flex;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }
        .form-score input {
            flex: 1;
            background: #0f3460;
            border: 1px solid #2a3a5c;
            border-radius: 10px;
            padding: 0.85rem 1rem;
            color: #eaeaea;
            font-size: 1rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s;
        }
        .form-score input:focus { border-color: #e94560; }
        .form-score input::placeholder { color: #4a5578; }
        .form-score input:disabled { opacity: 0.5; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.85rem 1.6rem;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.12s, box-shadow 0.12s, opacity 0.12s;
        }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        .btn-primary {
            background: #e94560;
            color: #fff;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.35);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 14px 40px rgba(233, 69, 96, 0.5);
        }

        .btn-secondary {
            background: #0f3460;
            color: #eaeaea;
            border: 1px solid #2a3a5c;
        }
        .btn-secondary:hover:not(:disabled) { border-color: #e94560; color: #e94560; }

        .acoes {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ---------- Status ---------- */
        .status {
            font-size: 0.9rem;
            margin-top: 1rem;
            min-height: 1.2rem;
        }
        .status.ok { color: #4ade80; }
        .status.erro { color: #ff7b8a; }

        /* ---------- Loading ---------- */
        .loading {
            color: #8a8fa3;
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="logo">ARCADE <span>CENTRAL</span></div>
        <a class="back" href="/amandapps/">← Voltar para home</a>
    </div>

    <div class="container" id="conteudo">
        <p class="loading">Carregando...</p>
    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // =====================================================
        // CONFIG
        // =====================================================
        const HOME_URL      = '/amandapps/';
        const INFO_JSON_URL = '/amandapps/jogos-info.json';
        const JOGO_BASE_PATH = '/amandapps';

        const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // =====================================================
        // HELPERS
        // =====================================================
        function escapeHTML(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
            }[c]));
        }

        function getParams() {
            const p = new URLSearchParams(window.location.search);
            const gameId = (p.get('id') || '').trim().replace(/[^a-zA-Z0-9_-]/g, '');
            const rawScore = p.get('score');
            let score = null;
            if (rawScore !== null) {
                const n = Number(rawScore);
                if (Number.isFinite(n)) score = Math.max(0, Math.floor(n));
            }
            return { gameId, score };
        }

        function mostrarErro(msg, detalhe) {
            document.getElementById('conteudo').innerHTML = `
                <div class="gameover-card">
                    <h1>Ops!</h1>
                    <p class="subtitulo">${escapeHTML(msg)}</p>
                    ${detalhe ? `<p style="color:#8a8fa3;font-size:0.85rem;margin-bottom:1.5rem;">${escapeHTML(detalhe)}</p>` : ''}
                    <div class="acoes">
                        <a class="btn btn-secondary" href="${HOME_URL}">← Voltar para home</a>
                    </div>
                </div>
            `;
        }

        // =====================================================
        // 5º COLOCADO (Opção A)
        // Pega a 5ª maior pontuação do jogo usando range(4,4)
        // (índice 4 = posição 5). Retorna null se não houver 5 scores.
        // =====================================================
        async function getQuintoLugar(gameId) {
            const { data, error } = await _supabase
                .from('scores')
                .select('score')
                .eq('game_id', gameId)
                .order('score', { ascending: false })
                .range(4, 4);

            if (error) {
                console.error('[fim-de-jogo] erro ao buscar 5º lugar:', error);
                return { valor: null, erro };
            }
            if (!data || data.length === 0) return { valor: null, erro: null };
            return { valor: Number(data[0].score), erro: null };
        }

        // =====================================================
        // SALVAR SCORE
        // =====================================================
        async function salvarScore(gameId, playerName, score) {
            const nome = (playerName || '').trim().slice(0, 20) || 'Anônimo';
            const { data, error } = await _supabase
                .from('scores')
                .insert({ game_id: gameId, player_name: nome, score })
                .select()
                .single();
            return { data, error };
        }

        // =====================================================
        // INIT
        // =====================================================
        async function carregar() {
            const { gameId, score } = getParams();

            if (!gameId) {
                mostrarErro('Jogo não especificado.', 'A URL precisa do parâmetro ?id=algum_jogo');
                return;
            }
            if (score === null) {
                mostrarErro('Pontuação não informada.', 'A URL precisa do parâmetro ?score=123');
                return;
            }

            // ---- Carrega título do JSON (opcional) ----
            let tituloJogo = gameId;
            try {
                const resp = await fetch(INFO_JSON_URL, { cache: 'no-cache' });
                if (resp.ok) {
                    const all = await resp.json();
                    if (all[gameId]?.titulo) tituloJogo = all[gameId].titulo;
                }
            } catch (e) {
                console.warn('[fim-de-jogo] jogos-info.json indisponível:', e);
            }

            // ---- Busca o 5º colocado no Supabase ----
            const { valor: quinto, erro: erroQuinto } = await getQuintoLugar(gameId);
            if (erroQuinto) {
                console.warn('[fim-de-jogo] não foi possível verificar o 5º lugar.');
            }

            // Critério: bateu recorde se não há 5º lugar (top 5 incompleto)
            // OU se a pontuação for >= ao 5º colocado.
            const bateuRecorde = (quinto === null) || (score >= quinto);

            // ---- Render ----
            const playUrl = `${JOGO_BASE_PATH}/${encodeURIComponent(gameId)}/index.html`;

            document.getElementById('conteudo').innerHTML = `
                <div class="gameover-card">
                    <h1 class="${bateuRecorde ? 'recorde' : ''}">
                        ${bateuRecorde ? '🏆 NOVO RECORDE!' : 'Fim de Jogo'}
                    </h1>
                    <p class="subtitulo">${escapeHTML(tituloJogo)}</p>

                    <div class="placar-box">
                        <div class="label">Sua pontuação</div>
                        <div class="valor ${bateuRecorde ? 'recorde' : ''}">
                            ${score.toLocaleString('pt-BR')}
                        </div>
                    </div>

                    ${bateuRecorde
                        ? `<div class="msg-recorde">
                               <span class="emoji">🎉</span>
                               Você entrou no Top 5! Salve seu nome abaixo.
                           </div>`
                        : `<p class="msg-normal">
                               O 5º colocado tem <strong>${quinto !== null ? quinto.toLocaleString('pt-BR') : '—'}</strong> pontos.
                               Continue tentando!
                           </p>`
                    }

                    ${bateuRecorde ? `
                        <div class="form-score">
                            <input id="nome" type="text" maxlength="20" placeholder="Seu nome" autocomplete="off">
                            <button class="btn btn-primary" id="btn-salvar">Salvar</button>
                        </div>
                    ` : ''}

                    <div class="acoes">
                        <a class="btn btn-primary" href="${playUrl}">▶ Jogar novamente</a>
                        <a class="btn btn-secondary" href="${HOME_URL}">← Home</a>
                    </div>

                    <div class="status" id="status"></div>
                </div>
            `;

            // ---- Handler do botão salvar ----
            if (bateuRecorde) {
                const input = document.getElementById('nome');
                const btn = document.getElementById('btn-salvar');
                const statusEl = document.getElementById('status');

                // Enter também salva
                input.addEventListener('keydown', (ev) => {
                    if (ev.key === 'Enter') btn.click();
                });

                btn.addEventListener('click', async () => {
                    const nome = input.value.trim();
                    if (!nome) {
                        statusEl.className = 'status erro';
                        statusEl.textContent = 'Digite um nome antes de salvar.';
                        input.focus();
                        return;
                    }

                    btn.disabled = true;
                    input.disabled = true;
                    statusEl.className = 'status';
                    statusEl.textContent = 'Salvando...';

                    const { error } = await salvarScore(gameId, nome, score);

                    if (error) {
                        console.error('[fim-de-jogo] erro ao salvar score:', error);
                        statusEl.className = 'status erro';
                        statusEl.textContent = 'Erro ao salvar. Tente novamente.';
                        btn.disabled = false;
                        input.disabled = false;
                        return;
                    }

                    statusEl.className = 'status ok';
                    statusEl.textContent = '✓ Pontuação salva no Top 5!';
                    btn.textContent = 'Salvo';
                });

                input.focus();
            }
        }

        document.addEventListener('DOMContentLoaded', carregar);
    </script>

</body>
</html>
