<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jogo — Arcade Central</title>

    <!-- CSS global (compartilhado com a index) -->
    <link rel="stylesheet" href="styles.css">

    <!-- CSS específico desta página (pode mover para jogo.css se quiser) -->
    <style>
        /* ---------- Layout do detalhe do jogo ---------- */
        .game-header {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 1.5rem;
            align-items: start;
            margin: 1rem 0 2rem;
        }
        @media (max-width: 720px) {
            .game-header { grid-template-columns: 1fr; }
        }

        .thumb-wrap {
            width: 100%;
            max-width: 300px;
            aspect-ratio: 300 / 250;
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin: 0 auto;
        }
        .thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .thumb-wrap .thumb-fallback {
            font-size: 5rem;
            color: var(--text-dim);
            display: none;
        }
        .thumb-wrap.error img { display: none; }
        .thumb-wrap.error .thumb-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .game-info h1 {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 0.4rem;
            color: var(--text-light);
        }
        .game-info .descricao {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.55;
            margin-bottom: 1.2rem;
        }
        .game-info .controles {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-bottom: 1.2rem;
        }
        .game-info .controles strong { color: var(--text-light); }

        .btn-play {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--accent);
            color: var(--text-light);
            padding: 0.9rem 2rem;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 30px var(--shadow-accent);
            transition: transform 0.12s, box-shadow 0.12s;
            text-decoration: none;
        }
        .btn-play:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 40px rgba(233, 69, 96, 0.5);
            text-decoration: none;
        }
        .btn-play:active { transform: translateY(0); }

        /* ---------- Leaderboard desta página ---------- */
        .lb {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        .lb table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.88rem;
        }
        .lb th, .lb td {
            padding: 0.65rem 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .lb th {
            background: var(--accent2);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-dim);
            font-weight: 700;
        }
        .lb tr:last-child td { border-bottom: none; }
        .lb .rank { color: var(--text-dim); width: 3rem; }
        .lb .player { font-weight: 600; }
        .lb .score { text-align: right; color: var(--gold-dark); font-weight: 700; }
        .lb tr:nth-child(1) .player { color: var(--gold-dark); }
        .lb tr:nth-child(2) .player { color: #d4d4d4; }
        .lb tr:nth-child(3) .player { color: #cd8f5f; }
        .lb .empty {
            text-align: center;
            color: var(--text-dim);
            padding: 1.5rem;
        }

        /* ---------- Erro ---------- */
        .erro {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            color: #ff7b8a;
        }
        .erro strong { display: block; font-size: 1.2rem; margin-bottom: 0.4rem; }
        .erro a { display: inline-block; margin-top: 1rem; }
    </style>
</head>
<body>

<!-- Cabeçalho no padrão da home -->
<header>
    <a class="logo" href="index.html" title="Ir para o início" aria-label="Ir para o início">
        <img src="thumbs-assets/logoamandapps.png" alt="Amand.Apps">
    </a>
    <div class="header-right">
        <div class="user-area">
            <button class="btn-auth" id="btn-go-home">← Voltar</button>
            <button class="btn-reload" id="btn-reload" title="Recarregar tela" aria-label="Recarregar tela">🔄</button>
        </div>
    </div>
</header>

<div class="container" id="conteudo">
    <!-- preenchido via JS -->
    <p style="color: var(--text-dim);">Carregando...</p>
</div>

<footer>
    Arcade Central &copy; 2026 · Feito com HTML5 + Supabase
</footer>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // =====================================================
    // CONFIG
    // =====================================================
    const HOME_URL      = 'index.html';
    const THUMB_DIR     = 'thumbs-assets';
    const INFO_JSON_URL = 'jogos-info.json';
    const JOGO_BASE_PATH = ''; // vazio = relativo à raiz da página; ajuste se os jogos ficarem em subpasta

    const SUPABASE_URL = 'https://ojnslmzbryfapmnwiefr.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9qbnNsbXpicnlmYXBtbndpZWZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzMDUwNjQsImV4cCI6MjEwNzg4MTA2NH0.yilHEBICm3Z-FDTp5n75AY8kUfKVzSXke1z0mDjkuQo';
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // =====================================================
    // HELPERS
    // =====================================================
    function getGameIdFromURL() {
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        if (!id) return null;
        return id.trim().replace(/[^a-zA-Z0-9_-]/g, '');
    }

    function escapeHTML(s) {
        return String(s).replace(/[&<>"']/g, c => ({
            '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
        }[c]));
    }

    function mostrarErro(msg, detalhe) {
        document.getElementById('conteudo').innerHTML = `
            <div class="erro">
                <strong>${escapeHTML(msg)}</strong>
                ${detalhe ? `<p>${escapeHTML(detalhe)}</p>` : ''}
                <a href="${HOME_URL}">← Voltar para home</a>
            </div>
        `;
    }

    // =====================================================
    // 10º COLOCADO — salva em localStorage (invisível na URL)
    // =====================================================
    function definirDecimoValor(valor, gameId) {
        try {
            localStorage.setItem('decimo_score', String(valor));
            localStorage.setItem('decimo_score_game', String(gameId || ''));
        } catch (e) {
            console.warn('[jogo] localStorage indisponível:', e);
        }

        window.DECIMO_SCORE = valor;

        let dbg = document.getElementById('debug-decimo');
        if (!dbg) {
            dbg = document.createElement('div');
            dbg.id = 'debug-decimo';
            dbg.style.cssText = `
                margin-top: 1.5rem;
                padding: 0.75rem 1rem;
                background: var(--accent2);
                border: 1px solid var(--accent);
                border-radius: 8px;
                font-family: ui-monospace, monospace;
                font-size: 0.85rem;
                color: var(--gold);
                word-break: break-all;
            `;
            document.querySelector('.container').appendChild(dbg);
        }
        dbg.textContent = `DEBUG → 10º colocado (game_id: ${gameId || '—'}): ${Number(valor).toLocaleString('pt-BR')} (raw: ${valor})`;

        console.log('[jogo] 10º colocado salvo em localStorage:', valor, 'game_id:', gameId);
    }

    // =====================================================
    // CARREGAR TUDO
    // =====================================================
    async function carregar() {
        const gameId = getGameIdFromURL();
        if (!gameId) {
            mostrarErro('Jogo não especificado.', 'A URL precisa do parâmetro ?id=algum_jogo');
            return;
        }

        let info = null;
        try {
            const resp = await fetch(INFO_JSON_URL, { cache: 'no-cache' });
            if (resp.ok) {
                const all = await resp.json();
                info = all[gameId] || null;
            }
        } catch (e) {
            console.warn('[jogo] não foi possível carregar jogos-info.json:', e);
        }

        const dados = {
            titulo:    info?.titulo    || gameId,
            descricao: info?.descricao || '',
            categoria: info?.categoria || '',
            controles: info?.controles || '',
            autor:     info?.autor     || ''
        };

        const thumbUrl = `${THUMB_DIR}/${encodeURIComponent(gameId)}.png`;
        const playUrl  = `${JOGO_BASE_PATH}/${encodeURIComponent(gameId)}/index.html`;

        document.getElementById('conteudo').innerHTML = `
            <div class="game-header">
                <div class="thumb-wrap" id="thumb-wrap">
                    <img id="thumb-img" src="${thumbUrl}" alt="${escapeHTML(dados.titulo)}">
                    <div class="thumb-fallback">🎮</div>
                </div>

                <div class="game-info">
                    <h1>${escapeHTML(dados.titulo)}</h1>

                    ${dados.descricao ? `<p class="descricao">${escapeHTML(dados.descricao)}</p>` : ''}
                    ${dados.controles ? `<p class="controles"><strong>Controles:</strong> ${escapeHTML(dados.controles)}</p>` : ''}
                    <a class="btn-play" href="${playUrl}">▶ PLAY</a>
                </div>
            </div>

            <h2 class="section-title">Melhores pontuações</h2>
            <div class="lb">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Jogador</th>
                            <th style="text-align:right;">Pontos</th>
                        </tr>
                    </thead>
                    <tbody id="lb-body">
                        <tr><td colspan="3" class="empty">Carregando...</td></tr>
                    </tbody>
                </table>
            </div>

            <p style="margin-top:1.5rem; font-size:0.7rem; color: rgba(255,255,255,0.25); font-family:ui-monospace,monospace;">
                game_id: ${escapeHTML(gameId)}
            </p>
        `;

        const thumbImg = document.getElementById('thumb-img');
        const thumbWrap = document.getElementById('thumb-wrap');
        thumbImg.onerror = () => {
            thumbWrap.classList.add('error');
            thumbImg.removeAttribute('src');
            console.warn('[jogo] thumb não encontrada:', thumbUrl);
        };

        await carregarLeaderboard(gameId);
    }

    async function carregarLeaderboard(gameId) {
        const tbody = document.getElementById('lb-body');
        if (!tbody) return;

        const { data, error } = await _supabase
            .from('scores')
            .select('player_name, score, created_at')
            .eq('game_id', gameId)
            .order('score', { ascending: false })
            .limit(10);

        if (error) {
            console.error('[jogo] erro ao buscar leaderboard:', error);
            tbody.innerHTML = `<tr><td colspan="3" class="empty">Erro ao carregar pontuações.</td></tr>`;
            definirDecimoValor(0, gameId);
            return;
        }

        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="empty">Nenhuma pontuação ainda. Seja o primeiro!</td></tr>`;
            definirDecimoValor(0, gameId);
            return;
        }

        tbody.innerHTML = data.map((row, i) => `
            <tr>
                <td class="rank">${i + 1}</td>
                <td class="player">${escapeHTML(row.player_name || 'Um Amanfã')}</td>
                <td class="score">${Number(row.score).toLocaleString('pt-BR')}</td>
            </tr>
        `).join('');

        const valorDecimo = (data.length >= 10) ? (Number(data[9].score) || 0) : 0;
        definirDecimoValor(valorDecimo, gameId);
    }

    // =====================================================
    // INIT
    // =====================================================
    document.addEventListener('DOMContentLoaded', () => {
        // Botão voltar (header) → home
        document.getElementById('btn-go-home').addEventListener('click', () => {
            window.location.href = HOME_URL;
        });

        // Botão recarregar
        document.getElementById('btn-reload').addEventListener('click', () => {
            location.reload();
        });

        carregar();
    });
</script>

</body>
</html>
